name: Build Wave Browser (WiiU)

on:
  push:
    branches:
      - main
    paths:
      - 'WiiU/**'
      - 'Makefile'
      - 'wave_browser/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'WiiU/**'
      - 'Makefile'
      - 'wave_browser/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

# Only the newest build for a branch should wait for the matching WebKit engine.
# Cancel older waiters when either repository changes instead of consuming runners.
concurrency:
  group: wave-browser-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITPPC: /opt/devkitpro/devkitPPC
      WUT_ROOT: /opt/devkitpro/wut
      PORTLIBS: /opt/devkitpro/portlibs/wiiu

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install dependencies
        run: |
          rm -f /etc/apt/sources.list.d/devkitpro*.list \
                /etc/apt/sources.list.d/devkitpro*.sources
          apt-get update && apt-get install -y zip libxml2-utils python3 wget fonts-roboto gh

      - name: Cache devkitPro WiiU portlibs
        id: dkp-cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            /opt/devkitpro/portlibs/wiiu
            /opt/devkitpro/portlibs/ppc
            /opt/devkitpro/wut
          key: dkp-wiiu-dev-${{ runner.os }}-v3

      - name: Install devkitPro WiiU libraries
        if: steps.dkp-cache.outputs.cache-hit != 'true'
        run: |
          CONF=/etc/pacman.conf
          if ! grep -q '^XferCommand' "$CONF" 2>/dev/null; then
            sed -i '/^\[options\]/a XferCommand = /usr/bin/curl --retry 5 --retry-delay 10 --max-time 600 -L -C - -f -o %o %u' "$CONF" || true
          fi
          for attempt in 1 2 3; do
            echo "-> dkp-pacman attempt $attempt / 3"
            dkp-pacman -Sy --noconfirm wiiu-dev && break
            echo "  failed - sleeping 30s..."
            sleep 30
          done

      - name: Add devkitPro tools to PATH
        run: |
          echo "/opt/devkitpro/devkitPPC/bin" >> $GITHUB_PATH
          echo "/opt/devkitpro/tools/bin" >> $GITHUB_PATH

      - name: Vendor minizip source
        run: |
          mkdir -p vendor/minizip
          BASE="https://raw.githubusercontent.com/madler/zlib/v1.3.1/contrib/minizip"
          for f in ioapi.h ioapi.c unzip.h unzip.c; do
            curl -fsSL "$BASE/$f" -o "vendor/minizip/$f"
          done

      - name: Prepare font
        run: |
          find /usr/share/fonts -name "Roboto-Bold.*" | head -1 | xargs -I{} cp {} wave_browser/font.ttf
          test -s wave_browser/font.ttf
          python3 -c "data=open('wave_browser/font.ttf','rb').read();open('wave_browser/font_data.h','w').write('static const unsigned char font_data[]={'+','.join(str(b) for b in data)+'};\\nstatic const unsigned int font_data_len='+str(len(data))+';\\n')"

      - name: Wait for the matching WebKit-WiiU Actions artifact
        shell: bash
        timeout-minutes: 50
        run: |
          set -euo pipefail
          mkdir -p build build/webkit-wiiu-artifact
          WEBKIT_SHA=""
          ARTIFACT_URL=""
          RUN_ID=""
          for attempt in $(seq 1 45); do
            # Bind the download to the exact WebKit main commit. Never accept the
            # bootstrap archive or a full-engine artifact from an older revision.
            if [ -z "$WEBKIT_SHA" ] || [ $((attempt % 5)) -eq 0 ]; then
              WEBKIT_SHA=$(curl -fsSL \
                https://api.github.com/repos/baldbuffalo/webkit-wiiu/commits/main \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')
            fi
            CODE=$(curl -sS -o build/webkit-runs.json -w '%{http_code}' \
              "https://api.github.com/repos/baldbuffalo/webkit-wiiu/actions/runs?head_sha=$WEBKIT_SHA&status=completed&per_page=100" || true)
            if [ "$CODE" = "200" ]; then
              RUN_ID=$(python3 -c '
          import json,sys
          data=json.load(open("build/webkit-runs.json"))
          runs=[r for r in data.get("workflow_runs", [])
                if r.get("head_sha") == sys.argv[1]]
          print(runs[0]["id"] if runs else "")' "$WEBKIT_SHA")
              if [ -n "$RUN_ID" ]; then
                CODE=$(curl -sS -o build/webkit-artifacts.json -w '%{http_code}' \
                  "https://api.github.com/repos/baldbuffalo/webkit-wiiu/actions/runs/$RUN_ID/artifacts?name=webkit-wiiu-full-engine&per_page=100" || true)
                if [ "$CODE" = "200" ]; then
                  ARTIFACT_URL=$(python3 -c '
          import json,sys
          data=json.load(open("build/webkit-artifacts.json"))
          artifacts=[a for a in data.get("artifacts", [])
                     if a.get("name") == "webkit-wiiu-full-engine"
                     and not a.get("expired", False)]
          print(artifacts[0]["archive_download_url"] if artifacts else "")')
                  if [ -n "$ARTIFACT_URL" ]; then break; fi
                fi
              fi
            fi
            echo "Waiting for successful full-engine Actions artifact for $WEBKIT_SHA (attempt $attempt/45)."
            sleep 60
          done
          if [ -z "$ARTIFACT_URL" ] || [ -z "$RUN_ID" ]; then
            echo "::error::No successful, unexpired webkit-wiiu-full-engine Actions artifact exists for current main commit $WEBKIT_SHA."
            exit 1
          fi

          # The source repository is public, so the artifact API can be read
          # directly without a personal token or user-created secret.
          curl -fL --retry 3 --retry-delay 2 "$ARTIFACT_URL" -o build/webkit-engine-artifact.zip
          unzip -q build/webkit-engine-artifact.zip -d build/webkit-wiiu-artifact
          test -s build/webkit-wiiu-artifact/lib/libWebKitWKC.a
          test -s build/webkit-wiiu-artifact/include/wkc/wkcbase.h
          test -s build/webkit-wiiu-artifact/include/wkc/WKCWebView.h
          test -s build/webkit-wiiu-artifact/include/wkc/WKCClientBuilders.h
          test -s build/webkit-wiiu-artifact/BUILD_PROFILE.txt
          grep -q "Full WebKit page engine" build/webkit-wiiu-artifact/BUILD_PROFILE.txt
          echo "Using full WebKit engine Actions artifact from run $RUN_ID at commit $WEBKIT_SHA"

      - name: Build Wave Browser
        run: make -j$(nproc)

      - name: Validate meta.xml
        run: |
          if [ ! -f meta.xml ]; then echo "meta.xml missing!" && exit 1; fi
          xmllint --noout meta.xml

      - name: Prepare release folder
        run: |
          mkdir -p WaveBrowser
          cp WaveBrowser.wuhb WaveBrowser/
          cp meta.xml WaveBrowser/

      - name: Create release archive
        if: github.event_name != 'pull_request'
        run: |
          zip -j WaveBrowser.zip WaveBrowser/WaveBrowser.wuhb WaveBrowser/meta.xml

      - name: Publish latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest \
            WaveBrowser.zip \
            WaveBrowser/WaveBrowser.wuhb \
            --target "${GITHUB_SHA}" \
            --title "Wave Browser Latest" \
            --notes "Latest automated Wave Browser release." \
            --latest

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: WaveBrowser
          path: WaveBrowser/
