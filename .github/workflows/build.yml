name: Build Wave Browser (WiiU)

on:
  push:
    branches:
      - main
    paths:
      - 'WiiU/**'
      - 'Makefile'
      - 'wave_browser/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'WiiU/**'
      - 'Makefile'
      - 'wave_browser/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

# Only the newest build for a branch should wait for the matching WebKit engine.
# Cancel older waiters when either repository changes instead of consuming runners.
concurrency:
  group: wave-browser-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITPPC: /opt/devkitpro/devkitPPC
      WUT_ROOT: /opt/devkitpro/wut
      PORTLIBS: /opt/devkitpro/portlibs/wiiu

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install dependencies
        run: |
          rm -f /etc/apt/sources.list.d/devkitpro*.list \
                /etc/apt/sources.list.d/devkitpro*.sources
          apt-get update && apt-get install -y zip libxml2-utils python3 wget fonts-roboto gh

      # The devkitpro/devkitppc image already includes the Wii U toolchain,
      # WUT and Wii U/PowerPC portlibs. Do not reinstall them from dkp-pacman:
      # GitHub-hosted runner IPs can receive HTTP 403 from pkg.devkitpro.org.

      - name: Add devkitPro tools to PATH
        run: |
          echo "/opt/devkitpro/devkitPPC/bin" >> $GITHUB_PATH
          echo "/opt/devkitpro/tools/bin" >> $GITHUB_PATH

      - name: Vendor minizip source
        run: |
          mkdir -p vendor/minizip
          BASE="https://raw.githubusercontent.com/madler/zlib/v1.3.1/contrib/minizip"
          for f in ioapi.h ioapi.c unzip.h unzip.c; do
            curl -fsSL "$BASE/$f" -o "vendor/minizip/$f"
          done

      - name: Prepare font
        run: |
          find /usr/share/fonts -name "Roboto-Bold.*" | head -1 | xargs -I{} cp {} wave_browser/font.ttf
          test -s wave_browser/font.ttf
          python3 -c "data=open('wave_browser/font.ttf','rb').read();open('wave_browser/font_data.h','w').write('static const unsigned char font_data[]={'+','.join(str(b) for b in data)+'};\\nstatic const unsigned int font_data_len='+str(len(data))+';\\n')"

      - name: Use WebKit engine if available
        id: webkit
        shell: bash
        timeout-minutes: 5
        run: |
          set -uo pipefail
          echo "wkc_available=0" >> "$GITHUB_OUTPUT"
          mkdir -p build build/webkit-wiiu-artifact
          WEBKIT_SHA=""
          if WEBKIT_SHA=$(curl -fsSL --max-time 20 \
            https://api.github.com/repos/baldbuffalo/webkit-wiiu/commits/main \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])'); then
            TAG="engine-$WEBKIT_SHA"
            if curl -fsSL --max-time 20 \
              "https://api.github.com/repos/baldbuffalo/webkit-wiiu/releases/tags/$TAG" \
              -o build/webkit-release.json; then
              ASSET_URL=$(python3 -c '
          import json
          data=json.load(open("build/webkit-release.json"))
          assets=[a for a in data.get("assets", [])
                  if a.get("name") == "webkit-wiiu-full-engine.tar.gz"
                  and a.get("state") == "uploaded"
                  and a.get("size", 0) > 0]
          print(assets[0]["browser_download_url"] if assets else "")' 2>/dev/null || true)
              if [ -n "${ASSET_URL:-}" ] && \
                 curl -fsSL --max-time 180 --retry 2 --retry-delay 2 "$ASSET_URL" -o build/webkit-engine-artifact.tar.gz; then
                if tar -xzf build/webkit-engine-artifact.tar.gz -C build/webkit-wiiu-artifact 2>/dev/null; then
                  echo "wkc_available=1" >> "$GITHUB_OUTPUT"
                  echo "Downloaded and extracted WebKit engine bundle for commit $WEBKIT_SHA (using it without additional validation)."
                else
                  rm -rf build/webkit-wiiu-artifact
                  mkdir -p build/webkit-wiiu-artifact
                  echo "::notice::WebKit engine bundle could not be extracted; WKC_AVAILABLE is temporarily disabled for this CI build."
                fi
              else
                echo "::notice::No full WebKit engine asset found for $WEBKIT_SHA; WKC_AVAILABLE is temporarily disabled for this CI build."
              fi
            else
              echo "::warning::No matching WebKit engine release found for $WEBKIT_SHA; WKC_AVAILABLE is temporarily disabled for this CI build."
            fi
          else
            echo "::notice::Could not resolve WebKit-WiiU engine revision; WKC_AVAILABLE is temporarily disabled for this CI build."
          fi

      - name: Build and install RPXLoader library
        run: |
          git clone --depth 1 https://github.com/wiiu-env/librpxloader.git build/librpxloader
          make -C build/librpxloader install
          test -s /opt/devkitpro/wums/include/rpxloader/rpxloader.h
          test -s /opt/devkitpro/wums/lib/librpxloader.a

      - name: Build Wave Browser
        run: make -j$(nproc) WKC_AVAILABLE=${{ steps.webkit.outputs.wkc_available }}

      - name: Validate meta.xml
        run: |
          if [ ! -f meta.xml ]; then echo "meta.xml missing!" && exit 1; fi
          xmllint --noout meta.xml

      - name: Prepare release folder
        run: |
          mkdir -p WaveBrowser
          cp WaveBrowser.wuhb WaveBrowser/
          cp meta.xml WaveBrowser/

      - name: Publish latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          SHORT_SHA="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest \
            WaveBrowser/WaveBrowser.wuhb \
            --target "${GITHUB_SHA}" \
            --title "Wave Browser Latest" \
            --notes "Latest automated Wave Browser release." \
            --latest

