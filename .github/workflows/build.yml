name: Build Wave Browser (WiiU)

on:
  push:
    branches:
      - main
    paths:
      - 'wiiu/**'
  pull_request:
    paths:
      - 'wiiu/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITPPC: /opt/devkitpro/devkitPPC
      WUT_ROOT: /opt/devkitpro/wut
      PORTLIBS: /opt/devkitpro/portlibs/wiiu

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install dependencies
        run: |
          rm -f /etc/apt/sources.list.d/devkitpro*.list \
                /etc/apt/sources.list.d/devkitpro*.sources
          apt-get update && apt-get install -y zip libxml2-utils python3 wget fonts-roboto gh

      - name: Cache devkitPro WiiU portlibs
        id: dkp-cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            /opt/devkitpro/portlibs/wiiu
            /opt/devkitpro/portlibs/ppc
            /opt/devkitpro/wut
          key: dkp-wiiu-dev-${{ runner.os }}-v3

      - name: Install devkitPro WiiU libraries
        if: steps.dkp-cache.outputs.cache-hit != 'true'
        run: |
          CONF=/etc/pacman.conf
          if ! grep -q '^XferCommand' "$CONF" 2>/dev/null; then
            sed -i '/^\[options\]/a XferCommand = /usr/bin/curl --retry 5 --retry-delay 10 --max-time 600 -L -C - -f -o %o %u' "$CONF" || true
          fi
          for attempt in 1 2 3; do
            echo "-> dkp-pacman attempt $attempt / 3"
            dkp-pacman -Sy --noconfirm wiiu-dev && break
            echo "  failed - sleeping 30s..."
            sleep 30
          done

      - name: Add devkitPro tools to PATH
        run: |
          echo "/opt/devkitpro/devkitPPC/bin" >> $GITHUB_PATH
          echo "/opt/devkitpro/tools/bin" >> $GITHUB_PATH

      - name: Vendor minizip source
        run: |
          mkdir -p vendor/minizip
          BASE="https://raw.githubusercontent.com/madler/zlib/v1.3.1/contrib/minizip"
          for f in ioapi.h ioapi.c unzip.h unzip.c; do
            curl -fsSL "$BASE/$f" -o "vendor/minizip/$f"
          done

      - name: Prepare font
        run: |
          find /usr/share/fonts -name "Roboto-Bold.*" | head -1 | xargs -I{} cp {} wave_browser/font.ttf
          test -s wave_browser/font.ttf
          python3 -c "data=open('wave_browser/font.ttf','rb').read();open('wave_browser/font_data.h','w').write('static const unsigned char font_data[]={'+','.join(str(b) for b in data)+'};\\nstatic const unsigned int font_data_len='+str(len(data))+';\\n')"

      - name: Locate WebKit-WiiU artifact
        id: webkit-artifact
        uses: actions/github-script@v7
        with:
          script: |
            const owner = 'baldbuffalo';
            const repo = 'webkit-wiiu';
            const workflowFile = 'build.yml';
            const headers = {
              accept: 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28'
            };
            // Search recent completed main-branch runs and use the newest run
            // that actually contains the complete WebCore engine artifact. The
            // run may have a failed bootstrap job while the independent full-engine
            // build succeeds and publishes its artifact.
            const runsResponse = await fetch(
              `https://api.github.com/repos/${owner}/${repo}/actions/runs?branch=main&status=completed&per_page=30`,
              { headers }
            );
            if (!runsResponse.ok) throw new Error(`Could not list WebKit-WiiU runs: ${runsResponse.status}`);
            const runsData = await runsResponse.json();
            let chosen = null;
            let chosenArtifact = null;
            for (const run of runsData.workflow_runs) {
              if (run.path && !run.path.endsWith(`/${workflowFile}`)) continue;
              const ar = await fetch(
                `https://api.github.com/repos/${owner}/${repo}/actions/runs/${run.id}/artifacts?per_page=100`,
                { headers }
              );
              if (!ar.ok) continue;
              const data = await ar.json();
              const artifact = data.artifacts.find(a => a.name === 'webkit-wiiu-full-engine' && !a.expired);
              if (artifact) { chosen = run; chosenArtifact = artifact; break; }
            }
            if (!chosenArtifact) throw new Error('No unexpired webkit-wiiu-full-engine artifact was found in recent completed main runs.');
            core.setOutput('run_id', String(chosen.id));
            core.setOutput('artifact_id', String(chosenArtifact.id));
            core.info(`Selected artifact from WebKit-WiiU run ${chosen.id} (${chosen.created_at}).`);
      - name: Download artifact using workflow token
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.webkit-artifact.outputs.artifact_id }}
        run: |
          set -euo pipefail
          mkdir -p build/webkit-wiiu-artifact
          gh api -H "Accept: application/vnd.github+json" \
            "repos/baldbuffalo/webkit-wiiu/actions/artifacts/${ARTIFACT_ID}/zip" > build/webkit-artifact.zip
          unzip -q build/webkit-artifact.zip -d build/webkit-wiiu-artifact
          test -s build/webkit-wiiu-artifact/lib/libWebKitWKC.a
          test -d build/webkit-wiiu-artifact/include/wkc

      - name: Build Wave Browser
        run: make -j$(nproc)

      - name: Validate meta.xml
        run: |
          if [ ! -f meta.xml ]; then echo "meta.xml missing!" && exit 1; fi
          xmllint --noout meta.xml

      - name: Prepare release folder
        run: |
          mkdir -p WaveBrowser
          cp WaveBrowser.wuhb WaveBrowser/
          cp meta.xml WaveBrowser/

      - name: Create release archive
        if: github.event_name != 'pull_request'
        run: |
          zip -j WaveBrowser.zip WaveBrowser/WaveBrowser.wuhb WaveBrowser/meta.xml

      - name: Publish latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest \
            WaveBrowser.zip \
            WaveBrowser/WaveBrowser.wuhb \
            --target "${GITHUB_SHA}" \
            --title "Wave Browser Latest" \
            --notes "Latest automated Wave Browser release." \
            --latest

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: WaveBrowser
          path: WaveBrowser/
