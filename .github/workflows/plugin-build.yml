name: Build Wave Browser Plugin

on:
  push:
    branches:
      - main
    paths:
      - 'wave_browser/plugin/**'
      - '.github/workflows/plugin-build.yml'
  pull_request:
    paths:
      - 'wave_browser/plugin/**'
      - '.github/workflows/plugin-build.yml'
  workflow_dispatch:

jobs:
  build-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build plugin via Docker
        run: |
          docker build -t wavebrowser-plugin-builder wave_browser/plugin/
          docker run --rm \
            -v "$PWD/wave_browser:/wave_browser" \
            wavebrowser-plugin-builder \
            sh -c "cd /wave_browser/plugin && make -j$(nproc) && ls -lh WaveBrowserRemote.wps"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: plugin-wps
          path: wave_browser/plugin/WaveBrowserRemote.wps
