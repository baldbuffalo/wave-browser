name: Finalize Chromium for WaveBrowser

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Chromium revision SHA to finalize
        required: true
        type: string
  repository_dispatch:
    types: [chromium-source-ready]

concurrency:
  group: wave-browser-chromium-finalize
  cancel-in-progress: false

permissions:
  contents: write

env:
  WAVE_ONEDRIVE_PATH: WaveBrowser/Chromium

jobs:
  Finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install rclone
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rclone >/dev/null 2>&1; then
            tmp_dir=$(mktemp -d)
            trap 'rm -rf "$tmp_dir"' EXIT
            curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o "$tmp_dir/rclone.zip"
            python3 -c 'import sys,zipfile; p,o=sys.argv[1:]; z=zipfile.ZipFile(p); n=next(x for x in z.namelist() if x.endswith("/rclone")); z.extract(n,o); z.close()' "$tmp_dir/rclone.zip" "$tmp_dir"
            sudo install -m 0755 "$(find "$tmp_dir" -type f -name rclone -print -quit)" /usr/local/bin/rclone
          fi
          rclone version

      - name: Configure OneDrive
        shell: bash
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.WAVE_CHROMIUM_BACKUP_ONEDRIVE }}
        run: |
          set -euo pipefail
          test -n "$RCLONE_CONFIG_CONTENT" || { echo "Missing WAVE_CHROMIUM_BACKUP_ONEDRIVE repository secret."; exit 1; }
          mkdir -p "$HOME/.config/rclone"
          printf '%s\n' "$RCLONE_CONFIG_CONTENT" > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"

      - name: Check source and package state
        id: state
        env:
          REVISION: ${{ inputs.revision || github.event.client_payload.revision }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid Chromium revision: $REVISION"; exit 1; }

          root="onedrive:$WAVE_ONEDRIVE_PATH/$REVISION"
          if rclone cat "$root/package.ready.json" > "$RUNNER_TEMP/package.ready.json" 2>/dev/null; then
            if python3 - "$RUNNER_TEMP/package.ready.json" "$REVISION" <<'PY'
          import json
          import sys

          path, expected_revision = sys.argv[1:]
          try:
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(f"Invalid package.ready.json: {exc}")

          if data.get("revision") != expected_revision or data.get("ready_for_platform_builds") is not True:
              raise SystemExit("package.ready.json does not confirm the expected Chromium revision is finalized.")
          PY
            then
              echo "Chromium $REVISION is already finalized."
              echo "already=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if ! rclone cat "$root/source.ready.json" > "$RUNNER_TEMP/source.ready.json" 2>/dev/null; then
            echo "Chromium source-ready marker is missing: $root/source.ready.json"
            exit 1
          fi

          python3 - "$RUNNER_TEMP/source.ready.json" "$REVISION" <<'PY'
          import json
          import sys

          path, expected_revision = sys.argv[1:]
          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          if data.get("revision") != expected_revision or data.get("status") != "source-ready":
              raise SystemExit("source.ready.json does not confirm the expected Chromium revision is ready.")
          PY

          echo "already=false" >> "$GITHUB_OUTPUT"

      - name: Mount source from OneDrive
        if: steps.state.outputs.already != 'true'
        env:
          REVISION: ${{ inputs.revision || github.event.client_payload.revision }}
        shell: bash
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/chromium-source"
          mkdir -p "$source_root"
          rclone mount "onedrive:$WAVE_ONEDRIVE_PATH/$REVISION/source" "$source_root" \
            --vfs-cache-mode off \
            --dir-cache-time 10s \
            --poll-interval 30s \
            --buffer-size 16M \
            --transfers 4 \
            --checkers 8 &
          echo $! > "$RUNNER_TEMP/rclone-finalize-mount.pid"

          for _ in $(seq 1 60); do
            if mountpoint -q "$source_root"; then
              echo "OneDrive source mount is ready."
              exit 0
            fi
            sleep 2
          done

          echo "OneDrive source mount did not become ready."
          exit 1

      - name: Create verified platform source package in the same revision folder
        if: steps.state.outputs.already != 'true'
        env:
          REVISION: ${{ inputs.revision || github.event.client_payload.revision }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'if [ -f "$RUNNER_TEMP/rclone-finalize-mount.pid" ]; then kill "$(cat "$RUNNER_TEMP/rclone-finalize-mount.pid")" 2>/dev/null || true; fi; fusermount3 -u "$RUNNER_TEMP/chromium-source" 2>/dev/null || true' EXIT

          root="onedrive:$WAVE_ONEDRIVE_PATH/$REVISION"
          source_root="$RUNNER_TEMP/chromium-source"
          package="$root/package/chromium-$REVISION.tar.gz"
          package_partial="$root/package/chromium-$REVISION.tar.gz.partial"
          checksum="$root/package/chromium-$REVISION.sha256"
          checksum_partial="$root/package/chromium-$REVISION.sha256.partial"

          test -d "$source_root/src"
          test -f "$source_root/.gclient"

          echo "Creating the verified Chromium source package directly from the OneDrive checkout."
          rclone deletefile "$package_partial" >/dev/null 2>&1 || true
          tar -C "$source_root" -cf - \
            --exclude="./src/out" \
            --exclude="./src/.cipd" \
            --exclude="*/.git" \
            --exclude="./.gclient_cache" \
            .gclient .gclient_entries src |
            gzip -1 |
            rclone rcat "$package_partial" --stats=10s --stats-one-line --onedrive-chunk-size 250M

          rclone moveto "$package_partial" "$package"

          hash=$(rclone cat "$package" | sha256sum | awk '{print $1}')
          printf '%s  chromium-%s.tar.gz\n' "$hash" "$REVISION" | rclone rcat "$checksum_partial"
          rclone moveto "$checksum_partial" "$checksum"

          expected=$(rclone cat "$checksum" | awk '{print $1}')
          actual=$(rclone cat "$package" | sha256sum | awk '{print $1}')
          test "$expected" = "$actual"
          rclone cat "$package" | tar -tzf - >/dev/null

          echo "Verified Chromium source package and checksum are ready; final completion marker will be written after repository and source cleanup succeed."

      - name: Commit Chromium revision
        if: steps.state.outputs.already != 'true'
        env:
          REVISION: ${{ inputs.revision || github.event.client_payload.revision }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' "$REVISION" > android/chromium_revision.txt
          printf '%s\n' "$REVISION" > windows/chromium_revision.txt
          git add android/chromium_revision.txt windows/chromium_revision.txt
          git diff --cached --quiet || git commit -m "Update Chromium revision"
          git push

      - name: Delete ONLY the source directory
        if: steps.state.outputs.already != 'true'
        env:
          REVISION: ${{ inputs.revision || github.event.client_payload.revision }}
        shell: bash
        run: |
          set -euo pipefail
          root="onedrive:$WAVE_ONEDRIVE_PATH/$REVISION"

          # Verify the package exists before deleting the source. If finalization
          # is interrupted or the package is missing, the source remains available
          # for another attempt instead of being irreversibly purged first.
          rclone lsf "$root/package/chromium-$REVISION.tar.gz" >/dev/null
          rclone lsf "$root/package/chromium-$REVISION.sha256" >/dev/null

          # Deliberately purge only /source. /package is outside this path.
          rclone purge "$root/source"
          # Write package.ready.json only after every finalization operation above
          # has succeeded. This is the durable "fully finalized" marker used by
          # update-chromium.yml, so it must never exist after a partial finalize.
          printf '{"revision":"%s","package_path":"package/chromium-%s.tar.gz","checksum_path":"package/chromium-%s.sha256","ready_for_platform_builds":true}\n' \
            "$REVISION" "$REVISION" "$REVISION" |
            rclone rcat "$root/package.ready.json"

          rclone lsf "$root/package.ready.json" >/dev/null

          printf '{"revision":"%s","status":"finalized","source_deleted":true,"package_path":"package"}\n' "$REVISION" |
            rclone rcat "$root/finalized.json"

          # The revision lock is only for one packaging job. Once that revision
          # is fully finalized, remove the global lock so the next manual
          # update-chromium run resolves the then-current Chromium main revision.
          rclone deletefile "onedrive:$WAVE_ONEDRIVE_PATH/current_revision.json" >/dev/null 2>&1 || true

          echo "Source deleted. Verified package remains in the revision folder. Revision lock cleared for the next packaging job."

      - name: Unmount OneDrive source
        if: always() && steps.state.outputs.already != 'true'
        shell: bash
        run: |
          set +e
          # Unmount first, then stop rclone. The finalize mount is read-only,
          # but this ordering is still safer and consistent with the download workflow.
          fusermount3 -u "$RUNNER_TEMP/chromium-source" 2>/dev/null || fusermount -u "$RUNNER_TEMP/chromium-source" 2>/dev/null || true
          if [ -f "$RUNNER_TEMP/rclone-finalize-mount.pid" ]; then
            mount_pid="$(cat "$RUNNER_TEMP/rclone-finalize-mount.pid")"
            for _ in $(seq 1 30); do
              kill -0 "$mount_pid" 2>/dev/null || break
              sleep 1
            done
            kill "$mount_pid" 2>/dev/null || true
          fi
