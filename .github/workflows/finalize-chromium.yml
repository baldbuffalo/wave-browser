name: Finalize Chromium for WaveBrowser

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Chromium revision SHA to finalize
        required: true
        type: string
  repository_dispatch:
    types: [chromium-source-ready]

# Update and Finalize share one lock so a manual run can never modify
# the same persistent OneDrive revision while the other workflow is active.
concurrency:
  group: wave-browser-chromium-packaging
  cancel-in-progress: false

permissions:
  contents: write

env:
  WAVE_ONEDRIVE_PATH: WaveBrowser/Chromium

jobs:
  Finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 345

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install rclone
        shell: bash
        run: |
          set -euo pipefail

          tools_root="$HOME/.cache/wave-browser/tools"
          bin_dir="$tools_root/bin"
          mkdir -p "$bin_dir"

          tmp_dir=$(mktemp -d)
          trap 'rm -rf "$tmp_dir"' EXIT

          archive_name="rclone-v1.75.1-linux-amd64.zip"
          archive_path="$tmp_dir/$archive_name"

          curl -fsSL "https://downloads.rclone.org/v1.75.1/$archive_name" \
            -o "$archive_path"

          curl -fsSL "https://downloads.rclone.org/v1.75.1/SHA256SUMS" \
            -o "$tmp_dir/SHA256SUMS"

          (
            cd "$tmp_dir"
            grep " $archive_name$" SHA256SUMS | sha256sum -c -
          )

          python3 -c 'import sys,zipfile; p,o=sys.argv[1:]; z=zipfile.ZipFile(p); n=next(x for x in z.namelist() if x.endswith("/rclone")); z.extract(n,o); z.close()' \
            "$archive_path" "$tmp_dir"

          install -m 0755 \
            "$(find "$tmp_dir" -type f -name rclone -print -quit)" \
            "$bin_dir/rclone"

          echo "$bin_dir" >> "$GITHUB_PATH"
          "$bin_dir/rclone" version

      - name: Configure OneDrive
        shell: bash
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.WAVE_CHROMIUM_BACKUP_ONEDRIVE }}
        run: |
          set -euo pipefail

          test -n "$RCLONE_CONFIG_CONTENT" || {
            echo "Missing WAVE_CHROMIUM_BACKUP_ONEDRIVE repository secret."
            exit 1
          }

          mkdir -p "$HOME/.config/rclone"
          printf '%s\n' "$RCLONE_CONFIG_CONTENT" \
            > "$HOME/.config/rclone/rclone.conf"

          chmod 600 "$HOME/.config/rclone/rclone.conf"


      - name: Check package and finalization state
        id: state
        env:
          REVISION: ${{ inputs.revision || github.event.client_payload.revision }}
        shell: bash
        run: |
          set -euo pipefail

          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Invalid Chromium revision: $REVISION"
            exit 1
          }

          root="onedrive:$WAVE_ONEDRIVE_PATH/$REVISION"
          package="$root/package/chromium-$REVISION.tar.gz"
          checksum="$root/package/chromium-$REVISION.sha256"

          # update-chromium.yml publishes package.ready.json only after it
          # verifies the uploaded package and checksum, so it is the gate that
          # guarantees the engine download this finalize job consumes exists.
          if ! rclone cat "$root/package.ready.json" \
            > "$RUNNER_TEMP/package.ready.json" 2>/dev/null; then
            echo "Chromium $REVISION is not ready to finalize: missing $root/package.ready.json. Run update-chromium.yml first."
            exit 1
          fi

          python3 - "$RUNNER_TEMP/package.ready.json" "$REVISION" <<'PY'
          import json
          import sys

          path, expected_revision = sys.argv[1:]

          try:
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(f"Invalid package.ready.json: {exc}")

          expected_package = f"package/chromium-{expected_revision}.tar.gz"
          expected_checksum = f"package/chromium-{expected_revision}.sha256"

          if (
              data.get("revision") != expected_revision
              or data.get("ready_for_platform_builds") is not True
              or data.get("package_path") != expected_package
              or data.get("checksum_path") != expected_checksum
          ):
              raise SystemExit(
                  "package.ready.json does not confirm the expected "
                  "Chromium artifacts are ready."
              )
          PY

          rclone lsf "$package" >/dev/null
          rclone lsf "$checksum" >/dev/null

          pinned_android="$(tr -d '\r\n ' < android/chromium_revision.txt 2>/dev/null || true)"
          pinned_windows="$(tr -d '\r\n ' < windows/chromium_revision.txt 2>/dev/null || true)"

          if [ "$pinned_android" = "$REVISION" ] &&
             [ "$pinned_windows" = "$REVISION" ] &&
             rclone lsf "$root/finalized.json" >/dev/null 2>&1; then
            echo "Chromium $REVISION is already finalized and pinned for the platform builds."
            rclone deletefile "onedrive:$WAVE_ONEDRIVE_PATH/current_revision.json" >/dev/null 2>&1 || true
            echo "already=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "already=false" >> "$GITHUB_OUTPUT"

      - name: Verify the downloaded engine package
        if: steps.state.outputs.already != 'true'
        env:
          REVISION: ${{ inputs.revision || github.event.client_payload.revision }}
        shell: bash
        run: |
          set -euo pipefail

          root="onedrive:$WAVE_ONEDRIVE_PATH/$REVISION"
          package="$root/package/chromium-$REVISION.tar.gz"
          checksum="$root/package/chromium-$REVISION.sha256"

          # The Android and Windows workflows restore this exact archive and run
          # their own gn/autoninja against it, so verify it is intact and
          # structurally readable before advertising it as finalized.
          expected=$(rclone cat "$checksum" | awk '{print $1}')
          [[ "$expected" =~ ^[0-9a-fA-F]{64}$ ]]

          actual=$(rclone cat "$package" | sha256sum | awk '{print $1}')
          test "$expected" = "$actual"

          if ! rclone cat "$package" | tar -tzf - >/dev/null; then
            echo "Chromium engine package failed tar.gz validation."
            exit 1
          fi

          echo "Verified Chromium $REVISION engine package ($expected)."

      - name: Commit Chromium revision
        if: steps.state.outputs.already != 'true'
        env:
          REVISION: ${{ inputs.revision || github.event.client_payload.revision }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@github.com"

          printf '%s\n' "$REVISION" > android/chromium_revision.txt
          printf '%s\n' "$REVISION" > windows/chromium_revision.txt

          git add android/chromium_revision.txt windows/chromium_revision.txt

          git diff --cached --quiet ||
            git commit -m "Update Chromium revision"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Could not push the Chromium revision after 3 attempts."
              exit 1
            fi

            echo "Chromium revision push was rejected; retrying after fetching main again..."
            sleep $((attempt * 5))
          done

      - name: Publish finalized marker
        if: steps.state.outputs.already != 'true'
        env:
          REVISION: ${{ inputs.revision || github.event.client_payload.revision }}
        shell: bash
        run: |
          set -euo pipefail

          root="onedrive:$WAVE_ONEDRIVE_PATH/$REVISION"
          package="$root/package/chromium-$REVISION.tar.gz"
          checksum="$root/package/chromium-$REVISION.sha256"

          expected=$(rclone cat "$checksum" | awk '{print $1}')
          [[ "$expected" =~ ^[0-9a-fA-F]{64}$ ]]

          actual=$(rclone cat "$package" | sha256sum | awk '{print $1}')
          test "$expected" = "$actual"

          printf \
            '{"revision":"%s","status":"finalized","package_path":"package/chromium-%s.tar.gz","checksum_path":"package/chromium-%s.sha256","ready_for_platform_builds":true}\n' \
            "$REVISION" "$REVISION" "$REVISION" |
            rclone rcat "$root/finalized.json" --checksum

          rclone deletefile \
            "onedrive:$WAVE_ONEDRIVE_PATH/current_revision.json" \
            >/dev/null 2>&1 || true

          echo "Chromium $REVISION is finalized and pinned for the Android and Windows builds."
