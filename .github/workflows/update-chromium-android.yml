name: Update Chromium and build WaveBrowser

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-chromium:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Wave Browser
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "$RUNNER_TEMP/depot_tools"
          echo "$RUNNER_TEMP/depot_tools" >> "$GITHUB_PATH"

      - name: Fetch latest Chromium revision
        id: chromium
        working-directory: android
        run: |
          set -euo pipefail
          latest=$(git ls-remote https://chromium.googlesource.com/chromium/src.git refs/heads/main | awk '{print $1}')
          current=$(tr -d '[:space:]' < chromium_revision.txt 2>/dev/null || true)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$latest" > chromium_revision.txt
          fi

      - name: Stop when Chromium has not changed
        if: steps.chromium.outputs.changed == 'false'
        run: echo "Chromium is already up to date."

      - name: Sync Chromium
        if: steps.chromium.outputs.changed == 'true'
        working-directory: android
        run: |
          set -euo pipefail
          mkdir -p chromium-checkout
          cd chromium-checkout
          if [ ! -d .git ]; then
            fetch --nohooks https://chromium.googlesource.com/chromium/src.git src
          fi
          cd src
          git fetch origin main
          git checkout "${{ steps.chromium.outputs.latest }}"
          gclient sync --nohooks --revision src@${{ steps.chromium.outputs.latest }}

      - name: Build WaveBrowser.apk
        if: steps.chromium.outputs.changed == 'true'
        working-directory: android
        run: |
          set -euo pipefail
          echo "Chromium revision updated to ${{ steps.chromium.outputs.latest }}."
          echo "Wave's Chromium build integration will compile WaveBrowser.apk here."
          echo "A failed compilation intentionally fails this workflow so the failure can be inspected manually."
          # The full Chromium Android GN/Ninja build command will be wired here
          # once Wave's Chromium UI integration is implemented.

      - name: Commit Chromium revision
        if: steps.chromium.outputs.changed == 'true' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/chromium_revision.txt
          git diff --cached --quiet || git commit -m "android: update Chromium revision"
          git push
