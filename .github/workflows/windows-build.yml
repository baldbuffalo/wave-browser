name: Wave Windows Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-build.yml'

permissions:
  actions: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find latest successful Chromium updater run
        id: updater
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runs = gh run list --workflow update-chromium.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId'
          if (-not $runs) { throw 'No successful Chromium updater run with a Windows artifact was found.' }
          "run_id=$runs" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Download WaveBrowser.exe from Chromium updater
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download ${{ steps.updater.outputs.run_id }} --workflow update-chromium.yml --name WaveBrowser-Windows --dir windows/out

      - name: Verify WaveBrowser.exe
        shell: pwsh
        run: |
          if (-not (Test-Path windows/out/WaveBrowser.exe)) { throw 'WaveBrowser.exe was not produced by the Chromium updater.' }

      - name: Upload WaveBrowser.exe
        uses: actions/upload-artifact@v4
        with:
          name: WaveBrowser-Windows
          path: windows/out/WaveBrowser.exe
