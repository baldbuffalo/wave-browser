name: Wave Windows Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-build.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore Chromium build cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}\depot_tools
            ..\chromium
          key: wave-windows-chromium-${{ hashFiles('windows/chromium_revision.txt') }}
          restore-keys: |
            wave-windows-chromium-

      - name: Install or reuse depot_tools
        shell: pwsh
        run: |
          $depot = Join-Path $env:RUNNER_TEMP 'depot_tools'
          if (-not (Test-Path (Join-Path $depot 'gclient.bat'))) {
            git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git $depot
          }
          "DEPOT_TOOLS=$depot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$depot" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          if (-not (Test-Path (Join-Path $depot 'gclient.bat'))) { throw 'depot_tools installation failed' }

      - name: Build Wave Windows
        shell: cmd
        env:
          DEPOT_TOOLS: ${{ runner.temp }}\depot_tools
        run: windows\build_chromium.bat

      - name: Upload WaveBrowser.exe
        uses: actions/upload-artifact@v4
        with:
          name: WaveBrowser-Windows
          path: windows/out/WaveBrowser.exe
