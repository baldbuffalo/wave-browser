name: Generate Android Keystore

# Run this once to create the Wave Browser release keystore. You choose the
# passwords and the alias; the keystore never leaves GitHub except as the
# artifact you download. Keep the downloaded .jks and its passwords safe: if the
# key is lost, an installed Wave Browser can never be updated.
on:
  workflow_dispatch:
    inputs:
      store_password:
        description: "Keystore password (you choose it)"
        required: true
      key_password:
        description: "Key password (usually the same as the keystore password)"
        required: true
      alias:
        description: "Key alias"
        required: true
        default: "wavebrowser"

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore + fingerprints
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore wavebrowser-release.jks \
            -alias "${{ inputs.alias }}" \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storetype PKCS12 \
            -storepass "${{ inputs.store_password }}" \
            -keypass "${{ inputs.key_password }}" \
            -dname "CN=Wave Browser, OU=Wave, O=Wave Browser, C=US"
          echo "================ fingerprints ================"
          keytool -list -v -keystore wavebrowser-release.jks -alias "${{ inputs.alias }}" \
            -storepass "${{ inputs.store_password }}" | grep -iE 'SHA1:|SHA256:'
          base64 -w0 wavebrowser-release.jks > wavebrowser-release.jks.b64
          echo "=============================================="
          echo "Download the android-keystore artifact, then add its contents as the"
          echo "WAVE_ANDROID_KEYSTORE_BASE64 repository secret, and the password as"
          echo "WAVE_ANDROID_KEYSTORE_PASSWORD. Keep wavebrowser-release.jks itself."

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: android-keystore
          path: |
            wavebrowser-release.jks.b64
            wavebrowser-release.jks
          if-no-files-found: error
