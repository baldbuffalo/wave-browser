name: Wave Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'

permissions:
  actions: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find latest successful Chromium updater run
        id: updater
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh run list --workflow update-chromium.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "No successful Chromium updater run was found." >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download WaveBrowser.apk from Chromium updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ steps.updater.outputs.run_id }}" --workflow update-chromium.yml --name WaveBrowser-Android --dir android

      - name: Verify WaveBrowser.apk
        run: test -f android/WaveBrowser.apk

      - name: Upload WaveBrowser.apk
        uses: actions/upload-artifact@v4
        with:
          name: WaveBrowser-Android
          path: android/WaveBrowser.apk
