name: Wave Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'

jobs:
  build-android:
    runs-on: [self-hosted, wave-android]
    env:
      WAVE_CHROMIUM_ROOT: /opt/wave-build/chromium
      GIT_CACHE_PATH: /opt/wave-build/git-cache
      WAVE_DEPOT_TOOLS: /opt/wave-build/depot_tools
      WAVE_ONEDRIVE_PATH: WaveBrowser/Chromium
    steps:
      - uses: actions/checkout@v4

      - name: Prepare persistent tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /opt/wave-build/chromium /opt/wave-build/git-cache /opt/wave-build/depot_tools
          if [ ! -x "$WAVE_DEPOT_TOOLS/gclient" ]; then
            rm -rf "$WAVE_DEPOT_TOOLS"
            git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "$WAVE_DEPOT_TOOLS"
          fi
          echo "$WAVE_DEPOT_TOOLS" >> "$GITHUB_PATH"

      - name: Install rclone
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Configure OneDrive
        shell: bash
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.WAVE_CHROMIUM_BACKUP_ONEDRIVE }}
        run: |
          set -euo pipefail
          if [ -z "$RCLONE_CONFIG_CONTENT" ]; then
            echo "Missing WAVE_CHROMIUM_BACKUP_ONEDRIVE repository secret."
            exit 1
          fi
          mkdir -p "$HOME/.config/rclone"
          printf '%s\n' "$RCLONE_CONFIG_CONTENT" > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"

      - name: Get Chromium package from OneDrive
        shell: bash
        run: |
          set -euo pipefail
          REVISION=$(grep -v '^#' android/chromium_revision.txt | tr -d '[:space:]')
          if [[ ! "$REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid Chromium revision: $REVISION"
            exit 1
          fi

          marker="$WAVE_CHROMIUM_ROOT/.wave_revision"
          if [ -d "$WAVE_CHROMIUM_ROOT/src/.git" ] && [ -f "$marker" ] && [ "$(cat "$marker")" = "$REVISION" ]; then
            echo "Chromium $REVISION is already present locally; skipping OneDrive download."
            exit 0
          fi

          rm -rf "$WAVE_CHROMIUM_ROOT"
          mkdir -p "$WAVE_CHROMIUM_ROOT"
          rclone copyto "onedrive:$WAVE_ONEDRIVE_PATH/chromium-$REVISION.tar.gz" "/tmp/chromium-$REVISION.tar.gz" --progress
          rclone copyto "onedrive:$WAVE_ONEDRIVE_PATH/chromium-$REVISION.sha256" "/tmp/chromium-$REVISION.sha256"
          (cd /tmp && sha256sum -c "chromium-$REVISION.sha256")
          tar -xzf "/tmp/chromium-$REVISION.tar.gz" -C "$WAVE_CHROMIUM_ROOT"
          printf '%s\n' "$REVISION" > "$marker"
          rm -f "/tmp/chromium-$REVISION.tar.gz"

      - name: Build Wave Android
        shell: bash
        env:
          WAVE_CHROMIUM_PREPARED: "1"
        run: |
          chmod +x android/build_chromium.sh
          android/build_chromium.sh

      - name: Upload WaveBrowser.apk
        uses: actions/upload-artifact@v4
        with:
          name: WaveBrowser-Android
          path: android/WaveBrowser.apk
          retention-days: 90
