name: Wave Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'

# Android Chromium is built on the persistent wave-android runner.
# The Chromium checkout and Git cache live outside GITHUB_WORKSPACE, so
# UI-only changes reuse the existing Chromium checkout/build state instead
# of downloading Chromium again.

jobs:
  build-android:
    runs-on: [self-hosted, wave-android]
    env:
      WAVE_CHROMIUM_ROOT: /opt/wave-build/chromium
      GIT_CACHE_PATH: /opt/wave-build/git-cache
      WAVE_DEPOT_TOOLS: /opt/wave-build/depot_tools
    steps:
      - uses: actions/checkout@v4

      - name: Prepare persistent Chromium tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /opt/wave-build/chromium /opt/wave-build/git-cache /opt/wave-build/depot_tools
          if [ ! -x "$WAVE_DEPOT_TOOLS/gclient" ]; then
            rm -rf "$WAVE_DEPOT_TOOLS"
            git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "$WAVE_DEPOT_TOOLS"
          fi
          git config --global core.autocrlf false
          git config --global core.filemode false
          git config --global core.fscache true
          git config --global core.preloadindex true
          git config --global depot-tools.allowGlobalGitConfig false
          echo "$WAVE_DEPOT_TOOLS" >> "$GITHUB_PATH"

      - name: Verify persistent Chromium checkout
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$WAVE_CHROMIUM_ROOT/src/.git" ]; then
            echo "Persistent Chromium checkout is missing."
            echo "Run update-chromium.yml successfully once to initialize it."
            exit 1
          fi

      - name: Build Wave Android using existing Chromium checkout
        shell: bash
        run: |
          chmod +x android/build_chromium.sh
          android/build_chromium.sh

      - name: Upload WaveBrowser.apk
        uses: actions/upload-artifact@v4
        with:
          name: WaveBrowser-Android
          path: android/WaveBrowser.apk
          retention-days: 90
