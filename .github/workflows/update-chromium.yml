name: Package Chromium for WaveBrowser

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Chromium revision to resume (leave empty for latest main)"
        required: false
        type: string

concurrency:
  group: wave-browser-chromium-packaging
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  CHROMIUM_URL: https://chromium.googlesource.com/chromium/src.git
  WAVE_ONEDRIVE_PATH: WaveBrowser/Chromium

jobs:
  DownloadChromium:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      WORK_ROOT: ${{ github.workspace }}/../wave-chromium-source
    steps:
      - name: Install Chromium tools locally
        shell: bash
        run: |
          set -euo pipefail
          tools_root="$HOME/.cache/wave-browser/tools"
          bin_dir="$tools_root/bin"
          depot_tools_dir="$tools_root/depot_tools"
          mkdir -p "$bin_dir"

          if [ ! -x "$bin_dir/rclone" ]; then
            tmp_dir=$(mktemp -d)
            trap 'rm -rf "$tmp_dir"' EXIT
            curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o "$tmp_dir/rclone.zip"
            python3 -c 'import sys,zipfile; p,o=sys.argv[1:]; z=zipfile.ZipFile(p); n=next(x for x in z.namelist() if x.endswith("/rclone")); z.extract(n,o); z.close()' "$tmp_dir/rclone.zip" "$tmp_dir"
            install -m 0755 "$(find "$tmp_dir" -type f -name rclone -print -quit)" "$bin_dir/rclone"
          fi

          if [ ! -x "$depot_tools_dir/gclient" ]; then
            rm -rf "$depot_tools_dir"
            git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$depot_tools_dir"
          fi

          echo "$bin_dir" >> "$GITHUB_PATH"
          echo "$depot_tools_dir" >> "$GITHUB_PATH"
          "$bin_dir/rclone" version
          PATH="$depot_tools_dir:$bin_dir:$PATH" gclient --version

      - name: Configure OneDrive
        shell: bash
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.WAVE_CHROMIUM_BACKUP_ONEDRIVE }}
        run: |
          set -euo pipefail
          test -n "$RCLONE_CONFIG_CONTENT" || { echo "Missing WAVE_CHROMIUM_BACKUP_ONEDRIVE repository secret."; exit 1; }
          mkdir -p "$HOME/.config/rclone"
          printf '%s\n' "$RCLONE_CONFIG_CONTENT" > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"

      - name: Resolve Chromium revision
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          requested_revision="${{ inputs.revision }}"
          if [ -n "$requested_revision" ]; then
            latest="$requested_revision"
          else
            latest=$(timeout 90s git ls-remote "$CHROMIUM_URL" refs/heads/main | awk '{print $1}')
          fi
          [[ "$latest" =~ ^[0-9a-f]{40}$ ]] || { echo "Could not determine a valid Chromium revision."; exit 1; }

          revision_root="onedrive:$WAVE_ONEDRIVE_PATH/$latest"
          ready="$revision_root/package.ready.json"

          if rclone lsf "$ready" >/dev/null 2>&1; then
            echo "Chromium $latest is already finalized."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "revision=$latest" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          rclone mkdir "$revision_root/source"
          rclone mkdir "$revision_root/package"
          printf '{"revision":"%s","status":"downloading"}\n' "$latest" | rclone rcat "$revision_root/download.json"

          echo "revision=$latest" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Chromium revision: $latest"

      - name: Mount the Chromium source directory on OneDrive
        if: steps.revision.outputs.skip != 'true'
        env:
          REVISION: ${{ steps.revision.outputs.revision }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK_ROOT"
          rclone mount "onedrive:$WAVE_ONEDRIVE_PATH/$REVISION/source" "$WORK_ROOT" \
            --vfs-cache-mode writes \
            --vfs-write-back 5s \
            --dir-cache-time 10s \
            --poll-interval 30s \
            --buffer-size 16M \
            --transfers 4 \
            --checkers 8 &
          echo $! > "$RUNNER_TEMP/rclone-mount.pid"

          for _ in $(seq 1 60); do
            if mountpoint -q "$WORK_ROOT"; then
              echo "OneDrive Chromium source mount is ready."
              exit 0
            fi
            sleep 2
          done

          echo "OneDrive mount did not become ready."
          exit 1

      - name: Download Chromium and dependencies directly into OneDrive
        if: steps.revision.outputs.skip != 'true'
        env:
          REVISION: ${{ steps.revision.outputs.revision }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'if [ -f "$RUNNER_TEMP/rclone-mount.pid" ]; then kill "$(cat "$RUNNER_TEMP/rclone-mount.pid")" 2>/dev/null || true; fi; fusermount3 -u "$WORK_ROOT" 2>/dev/null || true' EXIT

          # The actual Chromium operation is limited to 5h30m. When that deadline
          # is reached, timeout stops the download before the runner hard limit.
          cat > "$RUNNER_TEMP/chromium-download.sh" <<'DOWNLOAD_SCRIPT'
          set -euo pipefail

          cd "$WORK_ROOT"
          export GCLIENT_CACHE_DIR="$WORK_ROOT/.gclient_cache"

          if [ ! -f .gclient ]; then
            gclient config \
              --name src \
              --custom-var=checkout_src_internal=False \
              --custom-var=checkout_agents_internal=False \
              "$CHROMIUM_URL"
          fi

          GIT_DIR="$RUNNER_TEMP/chromium-git"
          GIT_WORK_TREE="$WORK_ROOT/src"
          mkdir -p "$GIT_WORK_TREE"

          # Git metadata is runner-local, but Chromium files are persistent
          # on OneDrive. Recreate only metadata on a fresh run; never delete
          # the existing source tree because that would destroy resume state.
          if [ -f "$GIT_WORK_TREE/.git" ] && [ ! -d "$GIT_DIR" ]; then
            rm -f "$GIT_WORK_TREE/.git"
          fi

          if [ ! -d "$GIT_DIR" ]; then
            git init --separate-git-dir="$GIT_DIR" -b main "$GIT_WORK_TREE"
            git --git-dir="$GIT_DIR" --work-tree="$GIT_WORK_TREE" remote add origin "$CHROMIUM_URL"
          elif ! git --git-dir="$GIT_DIR" --work-tree="$GIT_WORK_TREE" remote get-url origin >/dev/null 2>&1; then
            git --git-dir="$GIT_DIR" --work-tree="$GIT_WORK_TREE" remote add origin "$CHROMIUM_URL"
          fi

          cd "$RUNNER_TEMP"
          git --git-dir="$GIT_DIR" --work-tree="$GIT_WORK_TREE" config http.version HTTP/1.1
          git --git-dir="$GIT_DIR" --work-tree="$GIT_WORK_TREE" config http.lowSpeedLimit 0
          git --git-dir="$GIT_DIR" --work-tree="$GIT_WORK_TREE" config http.lowSpeedTime 999999

          for attempt in 1 2 3; do
            if git --git-dir="$GIT_DIR" --work-tree="$GIT_WORK_TREE" fetch --no-tags --depth=1 origin "$REVISION"; then
              break
            fi
            echo "Chromium source fetch attempt $attempt failed; retrying..."
            sleep 10
            if [ "$attempt" -eq 3 ]; then exit 1; fi
          done

          # Update tracked source files while leaving untracked dependency data
          # intact so gclient can continue from the persistent OneDrive tree.
          git --git-dir="$GIT_DIR" --work-tree="$GIT_WORK_TREE" reset --hard "$REVISION"
          gclient sync --nohooks --no-history --jobs=8 --revision "src@$REVISION"

          test -d "$WORK_ROOT/src"
          test -f "$WORK_ROOT/.gclient"
          test -f "$WORK_ROOT/.gclient_entries"

          printf '{"revision":"%s","status":"source-ready","source_path":"source"}\n' "$REVISION" |
            rclone rcat "onedrive:$WAVE_ONEDRIVE_PATH/$REVISION/source.ready.json"

          echo "The complete Chromium checkout and dependencies are now stored in OneDrive."
          DOWNLOAD_SCRIPT

          set +e
          timeout --foreground --signal=TERM --kill-after=60s 330m \
            bash "$RUNNER_TEMP/chromium-download.sh"
          status=$?
          set -e

          if [ "$status" -eq 124 ] || [ "$status" -eq 143 ] || [ "$status" -eq 137 ]; then
            echo "5h30m download deadline reached; triggering the same workflow to resume revision $REVISION."
            payload=$(python3 -c 'import json,os; print(json.dumps({"ref":"main","inputs":{"revision":os.environ["REVISION"]}}))')
            curl -fsSL -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/update-chromium.yml/dispatches" \
              -d "$payload" >/dev/null
            echo "Fresh run queued for the same Chromium revision."
            exit 0
          fi

          exit "$status"

      - name: Unmount OneDrive source
        if: always() && steps.revision.outputs.skip != 'true'
        shell: bash
        run: |
          set +e
          if [ -f "$RUNNER_TEMP/rclone-mount.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/rclone-mount.pid")" 2>/dev/null || true
          fi
          fusermount3 -u "$WORK_ROOT" 2>/dev/null || fusermount -u "$WORK_ROOT" 2>/dev/null || true

      - name: Trigger Chromium Finalize workflow
        if: steps.revision.outputs.skip != 'true'
        env:
          REVISION: ${{ steps.revision.outputs.revision }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload=$(python3 -c 'import json,os; print(json.dumps({"event_type":"chromium-source-ready","client_payload":{"revision":os.environ["REVISION"]}}))')
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/dispatches" \
            -d "$payload"
          echo "Triggered Finalize for Chromium $REVISION."
