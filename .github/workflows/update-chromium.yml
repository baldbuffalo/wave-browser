name: Package Chromium for WaveBrowser

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-next-download-chunk]

concurrency:
  group: wave-browser-chromium-packaging
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

env:
  CHROMIUM_URL: https://chromium.googlesource.com/chromium/src
  WAVE_ONEDRIVE_PATH: WaveBrowser/Chromium
  DEPOT_TOOLS_UPDATE: "0"
  GSUTIL_ENABLE_LUCI_AUTH: "0"
  # Free space (GB) the build disk must have before we start. This is a guess:
  # check the "Prepare build disk" step output on the first run and adjust.
  REQUIRED_FREE_GB: "40"

jobs:
  PackageChromium:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Free Runner Disk Space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h / /mnt

      - name: Install Chromium tools locally
        shell: bash
        run: |
          set -euo pipefail

          tools_root="$HOME/.cache/wave-browser/tools"
          bin_dir="$tools_root/bin"
          depot_tools_dir="$tools_root/depot_tools"

          export PATH="$depot_tools_dir:$bin_dir:$PATH"

          mkdir -p "$bin_dir"

          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pigz

          if [ ! -x "$bin_dir/rclone" ]; then
            tmp_dir=$(mktemp -d)
            trap 'rm -rf "$tmp_dir"' EXIT

            archive_name="rclone-v1.75.1-linux-amd64.zip"
            archive_path="$tmp_dir/$archive_name"

            curl -fsSL "https://downloads.rclone.org/v1.75.1/$archive_name" \
              -o "$archive_path"
            curl -fsSL "https://downloads.rclone.org/v1.75.1/SHA256SUMS" \
              -o "$tmp_dir/SHA256SUMS"

            (
              cd "$tmp_dir"
              grep " $archive_name$" SHA256SUMS | sha256sum -c -
            )

            python3 -c '
          import sys
          import zipfile

          archive_path, output_dir = sys.argv[1:]

          with zipfile.ZipFile(archive_path) as z:
              binary = next(
                  name for name in z.namelist()
                  if name.endswith("/rclone")
              )
              z.extract(binary, output_dir)
          ' "$archive_path" "$tmp_dir"

            install -m 0755 \
              "$(find "$tmp_dir" -type f -name rclone -print -quit)" \
              "$bin_dir/rclone"
          fi

          if [ ! -x "$depot_tools_dir/gclient" ]; then
            rm -rf "$depot_tools_dir"
            git clone \
              --depth=1 \
              https://chromium.googlesource.com/chromium/tools/depot_tools.git \
              "$depot_tools_dir"
          fi

          if [ ! -f "$depot_tools_dir/python3_bin_reldir.txt" ]; then
            echo "Bootstrapping depot_tools Python runtime..."
            (
              cd "$depot_tools_dir"
              DEPOT_TOOLS_UPDATE=0 ./ensure_bootstrap
            )
          fi

          test -f "$depot_tools_dir/python3_bin_reldir.txt"
          test -x "$depot_tools_dir/luci-auth"
          command -v luci-auth

          echo "$bin_dir" >> "$GITHUB_PATH"
          echo "$depot_tools_dir" >> "$GITHUB_PATH"

          "$bin_dir/rclone" version
          PATH="$depot_tools_dir:$bin_dir:$PATH" \
            DEPOT_TOOLS_UPDATE=0 \
            gclient --version

      - name: Configure OneDrive
        shell: bash
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.WAVE_CHROMIUM_BACKUP_ONEDRIVE }}
        run: |
          set -euo pipefail

          test -n "$RCLONE_CONFIG_CONTENT" || {
            echo "Missing WAVE_CHROMIUM_BACKUP_ONEDRIVE repository secret."
            exit 1
          }

          mkdir -p "$HOME/.config/rclone"
          printf '%s\n' "$RCLONE_CONFIG_CONTENT" \
            > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"

      - name: Resolve Chromium revision
        id: revision
        shell: bash
        run: |
          set -euo pipefail

          lock_path="onedrive:$WAVE_ONEDRIVE_PATH/current_revision.json"

          if rclone cat "$lock_path" \
            > "$RUNNER_TEMP/current_revision.json" 2>/dev/null; then
            latest=$(python3 - "$RUNNER_TEMP/current_revision.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)

          print(data["revision"])
          PY
            )
          else
            latest=$(
              timeout 90s \
                git ls-remote "$CHROMIUM_URL" refs/heads/main |
                awk '{print $1}'
            )

            [[ "$latest" =~ ^[0-9a-f]{40}$ ]] || {
              echo "Could not determine a valid Chromium revision."
              exit 1
            }

            printf \
              '{"revision":"%s","created_at":"%s"}\n' \
              "$latest" \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" |
              rclone rcat "$lock_path"

            echo "Locked Chromium revision to $latest for this packaging job."
          fi

          [[ "$latest" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Persistent Chromium revision lock is invalid."
            exit 1
          }

          revision_root="onedrive:$WAVE_ONEDRIVE_PATH/$latest"
          ready="$revision_root/package.ready.json"

          if rclone cat "$ready" \
            > "$RUNNER_TEMP/package.ready.json" 2>/dev/null; then
            if python3 \
              - "$RUNNER_TEMP/package.ready.json" "$latest" <<'PY'
          import json
          import sys

          path, expected_revision = sys.argv[1:]

          try:
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(f"Invalid package.ready.json: {exc}")

          expected_package = f"package/chromium-{expected_revision}.tar.gz"
          expected_checksum = f"package/chromium-{expected_revision}.sha256"

          if (
              data.get("revision") != expected_revision
              or data.get("ready_for_platform_builds") is not True
              or data.get("package_path") != expected_package
              or data.get("checksum_path") != expected_checksum
          ):
              raise SystemExit(
                  "package.ready.json does not confirm the expected "
                  "Chromium artifacts are finalized."
              )
          PY
            then
              package_path=$(python3 \
                - "$RUNNER_TEMP/package.ready.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              print(json.load(f)["package_path"])
          PY
              )

              checksum_path=$(python3 \
                - "$RUNNER_TEMP/package.ready.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              print(json.load(f)["checksum_path"])
          PY
              )

              if \
                rclone lsf \
                  "onedrive:$WAVE_ONEDRIVE_PATH/$latest/$package_path" \
                  >/dev/null 2>&1 &&
                rclone lsf \
                  "onedrive:$WAVE_ONEDRIVE_PATH/$latest/$checksum_path" \
                  >/dev/null 2>&1
              then
                echo \
                  "Chromium $latest is already finalized and its package/checksum are present."

                rclone deletefile "$lock_path" \
                  >/dev/null 2>&1 || true
                echo "Cleared completed Chromium revision lock."

                echo "skip=true" >> "$GITHUB_OUTPUT"
                echo "revision=$latest" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              echo \
                "package.ready.json exists, but its package or checksum is missing; rebuilding."
            fi
          fi

          rclone mkdir "$revision_root/package"

          printf \
            '{"revision":"%s","status":"downloading","updated_at":"%s"}\n' \
            "$latest" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" |
            rclone rcat "$revision_root/download.json"

          echo "revision=$latest" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Chromium revision: $latest"

      - name: Lock depot_tools revision
        if: steps.revision.outputs.skip != 'true'
        env:
          REVISION: ${{ steps.revision.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail

          tools_dir="$HOME/.cache/wave-browser/tools/depot_tools"
          test -d "$tools_dir/.git"

          lock_path="onedrive:$WAVE_ONEDRIVE_PATH/$REVISION/depot_tools_revision.json"

          if rclone cat "$lock_path" \
            > "$RUNNER_TEMP/depot_tools_revision.json" 2>/dev/null; then
            locked=$(python3 \
              - "$RUNNER_TEMP/depot_tools_revision.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)

          print(data["revision"])
          PY
            )

            [[ "$locked" =~ ^[0-9a-f]{40}$ ]] || {
              echo "Invalid persisted depot_tools revision."
              exit 1
            }

            git -C "$tools_dir" fetch --depth=1 origin "$locked"
            git -C "$tools_dir" checkout --detach "$locked"
            echo "Using persisted depot_tools revision $locked."
          else
            locked=$(git -C "$tools_dir" rev-parse HEAD)

            [[ "$locked" =~ ^[0-9a-f]{40}$ ]] || {
              echo "Could not determine depot_tools revision."
              exit 1
            }

            printf \
              '{"revision":"%s","created_at":"%s"}\n' \
              "$locked" \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" |
              rclone rcat "$lock_path"

            echo "Locked depot_tools to $locked for Chromium $REVISION."
          fi

          if [ ! -f "$tools_dir/python3_bin_reldir.txt" ]; then
            echo "Bootstrapping the locked depot_tools revision..."
            (
              cd "$tools_dir"
              DEPOT_TOOLS_UPDATE=0 ./ensure_bootstrap
            )
          fi

          test -f "$tools_dir/python3_bin_reldir.txt"

          echo \
            "depot_tools revision: $(git -C "$tools_dir" rev-parse HEAD)"
          command -v gclient
          DEPOT_TOOLS_UPDATE=0 gclient --version

      - name: Prepare build disk
        if: steps.revision.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          need_kb=$((REQUIRED_FREE_GB * 1024 * 1024))
          best_dir=""
          best_free=0

          for base in /mnt "$HOME/work"; do
            [ -d "$base" ] || continue
            free_kb=$(df -Pk "$base" | awk 'NR==2 {print $4}')
            echo "$base: $((free_kb / 1024 / 1024)) GB free"
            if [ "$free_kb" -gt "$best_free" ]; then
              best_free="$free_kb"
              best_dir="$base"
            fi
          done

          if [ "$best_free" -lt "$need_kb" ]; then
            echo "::error::Best disk has $((best_free / 1024 / 1024)) GB free; need $REQUIRED_FREE_GB GB. Lower REQUIRED_FREE_GB or archive src and dependencies separately."
            exit 1
          fi

          if [ "$best_dir" = "/mnt" ]; then
            sudo mkdir -p /mnt/wave-chromium
            sudo chown "$(id -u):$(id -g)" /mnt/wave-chromium
            work_root="/mnt/wave-chromium/wave-chromium-source"
          else
            work_root="$HOME/work/wave-chromium-source"
          fi

          mkdir -p "$work_root"
          echo "WORK_ROOT=$work_root" >> "$GITHUB_ENV"
          echo "Using $work_root ($((best_free / 1024 / 1024)) GB free)."

      - name: Sync Chromium and dependencies on local disk
        if: steps.revision.outputs.skip != 'true'
        timeout-minutes: 150
        env:
          REVISION: ${{ steps.revision.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$WORK_ROOT"

          # No gclient git cache: it would mirror full src history.
          unset GCLIENT_CACHE_DIR

          git config --global gc.auto 0
          git config --global maintenance.auto false
          git config --global http.version HTTP/1.1
          git config --global http.lowSpeedLimit 1
          git config --global http.lowSpeedTime 600

          if [ ! -f .gclient ]; then
            gclient config --name src "$CHROMIUM_URL"
          fi

          if [ ! -e src/.git ]; then
            mkdir -p src
            git -C src init
            git -C src remote add origin "$CHROMIUM_URL"
          fi

          for attempt in 1 2 3 4 5; do
            find src/.git -maxdepth 1 -type f -name "*.lock" -delete 2>/dev/null || true

            if git -C src fetch \
              --no-tags --depth=1 --progress origin "$REVISION"
            then
              break
            fi

            echo "Fetch attempt $attempt failed; retrying..."
            [ "$attempt" -eq 5 ] && exit 1
            sleep $((attempt * 15))
          done

          GIT_TERMINAL_PROMPT=0 \
            git -C src checkout --force --detach "$REVISION"
          test "$(git -C src rev-parse HEAD)" = "$REVISION"
          echo "src checked out at $REVISION"
          df -h "$WORK_ROOT"

          for attempt in 1 2 3; do
            echo "gclient sync attempt $attempt/3"

            if gclient sync -v \
              --nohooks \
              --no-history \
              -j 8 \
              --revision "src@$REVISION"
            then
              break
            fi

            echo "gclient sync attempt $attempt failed."
            [ "$attempt" -eq 3 ] && exit 1
            sleep 30
          done

          test -d src
          test -f .gclient
          test -f .gclient_entries

          df -h "$WORK_ROOT"
          du -sh "$WORK_ROOT" 2>/dev/null || true

      - name: Stream Chromium package to OneDrive
        if: steps.revision.outputs.skip != 'true'
        timeout-minutes: 150
        env:
          REVISION: ${{ steps.revision.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail

          pkg_name="chromium-$REVISION.tar.gz"
          sum_name="chromium-$REVISION.sha256"
          remote_dir="onedrive:$WAVE_ONEDRIVE_PATH/$REVISION/package"
          remote_pkg="$remote_dir/$pkg_name"

          sha_file="$RUNNER_TEMP/pkg.sha256"
          size_file="$RUNNER_TEMP/pkg.size"

          work_parent="$(dirname "$WORK_ROOT")"
          work_name="$(basename "$WORK_ROOT")"

          uploaded=false

          for attempt in 1 2 3; do
            echo "Packaging and uploading attempt $attempt/3"
            rm -f "$sha_file" "$size_file"
            rclone deletefile "$remote_pkg" >/dev/null 2>&1 || true

            if tar -C "$work_parent" \
                --transform "s,^$work_name,chromium-$REVISION," \
                -cf - "$work_name" |
              pigz -p "$(nproc)" -3 |
              tee >(sha256sum | cut -d' ' -f1 > "$sha_file") \
                  >(wc -c > "$size_file") |
              rclone rcat "$remote_pkg" \
                --onedrive-chunk-size 120M \
                --retries 3 \
                --low-level-retries 20 \
                --timeout 5m \
                --stats 60s \
                --stats-one-line \
                -v
            then
              for _ in $(seq 1 120); do
                [ -s "$sha_file" ] && [ -s "$size_file" ] && break
                sleep 1
              done

              local_size="$(tr -d ' \n' < "$size_file")"
              remote_size="$(
                rclone size --json "$remote_pkg" |
                  python3 -c 'import json,sys; print(json.load(sys.stdin)["bytes"])'
              )"

              echo "Local stream size:  $local_size"
              echo "Remote object size: $remote_size"

              if [ "$local_size" = "$remote_size" ]; then
                uploaded=true
                break
              fi

              echo "Size mismatch after upload; retrying."
            else
              echo "Upload pipeline failed; retrying."
            fi

            sleep 30
          done

          [ "$uploaded" = "true" ] || {
            echo "::error::Package upload failed after 3 attempts."
            exit 1
          }

          sha="$(tr -d ' \n' < "$sha_file")"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || {
            echo "::error::Invalid SHA-256 computed for package."
            exit 1
          }

          printf '%s  %s\n' "$sha" "$pkg_name" |
            rclone rcat "$remote_dir/$sum_name"

          printf \
            '{"revision":"%s","ready_for_platform_builds":true,"package_path":"package/%s","checksum_path":"package/%s","sha256":"%s","size_bytes":%s,"created_at":"%s"}\n' \
            "$REVISION" \
            "$pkg_name" \
            "$sum_name" \
            "$sha" \
            "$local_size" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" |
            rclone rcat \
              "onedrive:$WAVE_ONEDRIVE_PATH/$REVISION/package.ready.json"

          printf \
            '{"revision":"%s","status":"complete","updated_at":"%s"}\n' \
            "$REVISION" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" |
            rclone rcat \
              "onedrive:$WAVE_ONEDRIVE_PATH/$REVISION/download.json"

          echo "Chromium $REVISION packaged: $pkg_name ($local_size bytes, sha256 $sha)."

      - name: Record failure
        if: failure() && steps.revision.outputs.skip != 'true'
        env:
          REVISION: ${{ steps.revision.outputs.revision }}
        shell: bash
        run: |
          set +e
          printf \
            '{"revision":"%s","status":"failed","updated_at":"%s"}\n' \
            "$REVISION" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" |
            rclone rcat \
              "onedrive:$WAVE_ONEDRIVE_PATH/$REVISION/download.json"
          exit 0
