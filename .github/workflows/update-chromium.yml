name: Update Chromium Revision

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  check-chromium:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check Chromium revision
        shell: bash
        run: |
          echo "Chromium revision tracking is managed by the platform build scripts."
          echo "Android: android/chromium_revision.txt"
          echo "Windows: windows/chromium_revision.txt"
      - name: Commit changed revision files
        shell: bash
        run: |
          if git diff --quiet -- android/chromium_revision.txt windows/chromium_revision.txt; then
            echo "No Chromium revision changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android/chromium_revision.txt windows/chromium_revision.txt
            git commit -m "chore: update Chromium revision"
            git push
          fi
