name: Update Chromium and build WaveBrowser

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  DEPOT_TOOLS: ${{ runner.temp }}/depot_tools

jobs:
  update-chromium:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [android, windows]
    steps:
      - name: Checkout Wave Browser
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install depot_tools
        shell: bash
        run: |
          set -euo pipefail
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "$DEPOT_TOOLS"
          echo "$DEPOT_TOOLS" >> "$GITHUB_PATH"
          echo "DEPOT_TOOLS=$DEPOT_TOOLS" >> "$GITHUB_ENV"
          export PATH="$DEPOT_TOOLS:$PATH"
          command -v gclient
          gclient --version

      - name: Check Chromium revision
        id: chromium
        shell: bash
        run: |
          set -euo pipefail
          latest=$(git ls-remote https://chromium.googlesource.com/chromium/src.git refs/heads/main | awk '{print $1}')
          file="${{ matrix.platform }}/chromium_revision.txt"
          current=$(grep -v '^#' "$file" | tr -d '[:space:]' || true)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$latest" > "$file"
          fi

      - name: Build updated Android browser
        if: matrix.platform == 'android' && steps.chromium.outputs.changed == 'true'
        working-directory: android
        shell: bash
        run: |
          export DEPOT_TOOLS="$DEPOT_TOOLS"
          export PATH="$DEPOT_TOOLS:$PATH"
          bash ./build_chromium.sh

      - name: Build updated Windows browser
        if: matrix.platform == 'windows' && steps.chromium.outputs.changed == 'true'
        shell: bash
        run: |
          export DEPOT_TOOLS="$DEPOT_TOOLS"
          export PATH="$DEPOT_TOOLS:$PATH"
          cmd.exe /c windows\\build_chromium.bat

      - name: Commit Chromium revision
        if: steps.chromium.outputs.changed == 'true' && success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ matrix.platform }}/chromium_revision.txt"
          git diff --cached --quiet || git commit -m "${{ matrix.platform }}: update Chromium revision"
          git push
