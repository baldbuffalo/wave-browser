name: Update Chromium and build WaveBrowser

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  CHROMIUM_URL: https://chromium.googlesource.com/chromium/src.git
  WAVE_ONEDRIVE_PATH: WaveBrowser/Chromium

jobs:
  check-chromium:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.revision.outputs.revision }}
      changed: ${{ steps.revision.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - id: revision
        shell: bash
        run: |
          set -euo pipefail
          latest=$(git ls-remote "$CHROMIUM_URL" refs/heads/main | awk '{print $1}')
          current=$(grep -v '^#' android/chromium_revision.txt | tr -d '[:space:]' || true)
          echo "revision=$latest" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  package-chromium:
    needs: check-chromium
    if: needs.check-chromium.outputs.changed == 'true'
    runs-on: [self-hosted, wave-android]
    env:
      WAVE_CHROMIUM_ROOT: /opt/wave-build/chromium
      GIT_CACHE_PATH: /opt/wave-build/git-cache
      WAVE_DEPOT_TOOLS: /opt/wave-build/depot_tools
    steps:
      - uses: actions/checkout@v4

      - name: Prepare persistent Chromium tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /opt/wave-build/chromium /opt/wave-build/git-cache /opt/wave-build/depot_tools
          if [ ! -x "$WAVE_DEPOT_TOOLS/gclient" ]; then
            rm -rf "$WAVE_DEPOT_TOOLS"
            git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "$WAVE_DEPOT_TOOLS"
          fi
          git config --global core.autocrlf false
          git config --global core.filemode false
          git config --global core.fscache true
          git config --global core.preloadindex true
          git config --global depot-tools.allowGlobalGitConfig false
          echo "$WAVE_DEPOT_TOOLS" >> "$GITHUB_PATH"

      - name: Prepare Chromium source and dependencies once
        shell: bash
        env:
          REVISION: ${{ needs.check-chromium.outputs.revision }}
        run: |
          set -euo pipefail
          cd "$WAVE_CHROMIUM_ROOT"

          if [ ! -d "src/.git" ]; then
            fetch --git-cache --nohooks chromium
          fi

          cd src
          git fetch origin main
          git checkout --detach "$REVISION"
          gclient sync --nohooks --process-all-deps --revision "src@$REVISION"

          cd ..
          rm -f "/tmp/chromium-$REVISION.tar.gz"
          tar             --exclude='src/out'             --exclude='src/.cipd'             -czf "/tmp/chromium-$REVISION.tar.gz"             .gclient .gclient_entries src

          sha256sum "/tmp/chromium-$REVISION.tar.gz" | tee "/tmp/chromium-$REVISION.sha256"

      - name: Install rclone
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Configure OneDrive
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.WAVE_ONEDRIVE_RCLONE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$RCLONE_CONFIG_B64" ]; then
            echo "Missing WAVE_ONEDRIVE_RCLONE_CONFIG_B64 repository secret."
            exit 1
          fi
          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          rclone listremotes

      - name: Upload Chromium package to OneDrive
        shell: bash
        env:
          REVISION: ${{ needs.check-chromium.outputs.revision }}
        run: |
          set -euo pipefail
          rclone copyto "/tmp/chromium-$REVISION.tar.gz" "onedrive:$WAVE_ONEDRIVE_PATH/chromium-$REVISION.tar.gz" --progress
          rclone copyto "/tmp/chromium-$REVISION.sha256" "onedrive:$WAVE_ONEDRIVE_PATH/chromium-$REVISION.sha256"

      - name: Commit Chromium revision
        shell: bash
        env:
          REVISION: ${{ needs.check-chromium.outputs.revision }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' "$REVISION" > android/chromium_revision.txt
          printf '%s\n' "$REVISION" > windows/chromium_revision.txt
          git add android/chromium_revision.txt windows/chromium_revision.txt
          git diff --cached --quiet || git commit -m "Update Chromium revision"
          git push
