name: Update Chromium and build WaveBrowser

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  CHROMIUM_URL: https://chromium.googlesource.com/chromium/src.git

jobs:
  check-chromium:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.revision.outputs.revision }}
      changed: ${{ steps.revision.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - id: revision
        shell: bash
        run: |
          set -euo pipefail
          latest=$(git ls-remote "$CHROMIUM_URL" refs/heads/main | awk '{print $1}')
          current=$(grep -v '^#' android/chromium_revision.txt | tr -d '[:space:]' || true)
          echo "revision=$latest" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build-android:
    needs: check-chromium
    if: needs.check-chromium.outputs.changed == 'true'
    runs-on: [self-hosted, wave-android]
    env:
      WAVE_CHROMIUM_ROOT: /opt/wave-build/chromium
      GIT_CACHE_PATH: /opt/wave-build/git-cache
      WAVE_DEPOT_TOOLS: /opt/wave-build/depot_tools
    steps:
      - uses: actions/checkout@v4
      - name: Prepare persistent Chromium tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /opt/wave-build/chromium /opt/wave-build/git-cache /opt/wave-build/depot_tools
          if [ ! -x "$WAVE_DEPOT_TOOLS/gclient" ]; then
            rm -rf "$WAVE_DEPOT_TOOLS"
            git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "$WAVE_DEPOT_TOOLS"
          fi
          git config --global core.autocrlf false
          git config --global core.filemode false
          git config --global core.fscache true
          git config --global core.preloadindex true
          git config --global depot-tools.allowGlobalGitConfig false
          echo "$WAVE_DEPOT_TOOLS" >> "$GITHUB_PATH"
      - name: Pin Chromium revision
        run: printf '%s\n' '${{ needs.check-chromium.outputs.revision }}' > android/chromium_revision.txt
      - name: Build Chromium + Wave Android
        run: |
          chmod +x android/build_chromium.sh
          android/build_chromium.sh
      - name: Upload Wave Android output
        uses: actions/upload-artifact@v4
        with:
          name: WaveBrowser-Android
          path: android/WaveBrowser.apk
          retention-days: 90

  build-windows:
    needs: check-chromium
    if: needs.check-chromium.outputs.changed == 'true'
    runs-on: [self-hosted, wave-windows]
    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: 0
      CHROMIUM_SRC: D:\wave-build\chromium\src
      GIT_CACHE_PATH: D:\wave-build\git-cache
      DEPOT_TOOLS: D:\wave-build\depot_tools
      WAVE_OUT: D:\wave-build\outputs
    steps:
      - uses: actions/checkout@v4
      - name: Prepare persistent Chromium tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'D:\wave-build', 'D:\wave-build\chromium', 'D:\wave-build\git-cache', 'D:\wave-build\outputs' | Out-Null
          if (-not (Test-Path (Join-Path $env:DEPOT_TOOLS 'gclient.bat'))) {
            New-Item -ItemType Directory -Force -Path $env:DEPOT_TOOLS | Out-Null
            git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git $env:DEPOT_TOOLS
          }
          git config --global core.autocrlf false
          git config --global core.filemode false
          git config --global core.fscache true
          git config --global core.preloadindex true
          git config --global depot-tools.allowGlobalGitConfig false
          $env:DEPOT_TOOLS | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Pin Chromium revision
        shell: pwsh
        run: Set-Content -Path windows/chromium_revision.txt -Value '${{ needs.check-chromium.outputs.revision }}'
      - name: Build Chromium + Wave Windows
        shell: cmd
        run: windows\build_chromium.bat
      - name: Upload Wave Windows output
        uses: actions/upload-artifact@v4
        with:
          name: WaveBrowser-Windows
          path: D:\wave-build\outputs\WaveBrowser.exe
          retention-days: 90

  commit-revision:
    needs: [check-chromium, build-android, build-windows]
    if: needs.check-chromium.outputs.changed == 'true' && needs.build-android.result == 'success' && needs.build-windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit Chromium revision
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' '${{ needs.check-chromium.outputs.revision }}' > android/chromium_revision.txt
          printf '%s\n' '${{ needs.check-chromium.outputs.revision }}' > windows/chromium_revision.txt
          git add android/chromium_revision.txt windows/chromium_revision.txt
          git diff --cached --quiet || git commit -m "Update Chromium revision"
          git push
