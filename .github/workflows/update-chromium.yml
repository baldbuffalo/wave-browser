name: Package Chromium for WaveBrowser

on:
  workflow_dispatch:

# Prevent two manual Chromium packaging runs from touching the same OneDrive staging area.
concurrency:
  group: wave-browser-chromium-packaging
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  CHROMIUM_URL: https://chromium.googlesource.com/chromium/src.git
  WAVE_ONEDRIVE_PATH: WaveBrowser/Chromium
  RUNNER_STORAGE_BUDGET_GIB: "14"
  CHECKPOINT_USED_GIB: "13"
  CHECKPOINT_INTERVAL_GIB: "1"

jobs:
  ResolveRevision:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.revision.outputs.revision }}
      already_finalized: ${{ steps.revision.outputs.already_finalized }}
    steps:
      - name: Check latest Chromium revision
        id: revision
        shell: bash
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.WAVE_CHROMIUM_BACKUP_ONEDRIVE }}
        run: |
          set -euo pipefail
          active_marker="onedrive:$WAVE_ONEDRIVE_PATH/active_revision.json"
          active_revision=""

          if ! command -v rclone >/dev/null 2>&1; then
            # Install only the rclone binary. The official install script also rebuilds
            # the runner's entire man-page database, which is unnecessary here.
            tmp_dir=$(mktemp -d)
            trap 'rm -rf "$tmp_dir"' EXIT
            curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o "$tmp_dir/rclone.zip"
            python3 -c 'import sys,zipfile; zip_path,out_dir=sys.argv[1],sys.argv[2]; z=zipfile.ZipFile(zip_path); binary=next(n for n in z.namelist() if n.endswith("/rclone")); z.extract(binary,out_dir); z.close(); print(binary)' "$tmp_dir/rclone.zip" "$tmp_dir"

            sudo install -m 0755 "$(find "$tmp_dir" -type f -name rclone -print -quit)" /usr/local/bin/rclone
            rclone version
          fi
          if [ -z "$RCLONE_CONFIG_CONTENT" ]; then
            echo "Missing WAVE_CHROMIUM_BACKUP_ONEDRIVE repository secret."
            exit 1
          fi
          mkdir -p "$HOME/.config/rclone"
          printf '%s\n' "$RCLONE_CONFIG_CONTENT" > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"

          if rclone lsf "$active_marker" >/dev/null 2>&1; then
            active_revision=$(rclone cat "$active_marker" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("revision",""))')
            if [[ ! "$active_revision" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Ignoring invalid active Chromium revision marker."
              active_revision=""
            fi
          fi

          if [ -n "$active_revision" ]; then
            latest="$active_revision"
            echo "Found an active Chromium packaging target: $latest"
            echo "A previous run started this revision, so this run will resume it instead of resolving a newer Chromium revision."
          else
            latest=$(git ls-remote "$CHROMIUM_URL" refs/heads/main | awk '{print $1}')
            if [[ ! "$latest" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Could not determine a valid Chromium revision."
              exit 1
            fi
            printf '{"revision":"%s","status":"active"}\n' "$latest" | rclone rcat "$active_marker"
            echo "Created persistent Chromium packaging target: $latest"
          fi

          echo "revision=$latest" >> "$GITHUB_OUTPUT"
          echo "Pinned Chromium revision for this workflow run: $latest"

          archive="onedrive:$WAVE_ONEDRIVE_PATH/chromium-$latest.tar.gz"
          checksum="onedrive:$WAVE_ONEDRIVE_PATH/chromium-$latest.sha256"
          ready="onedrive:$WAVE_ONEDRIVE_PATH/chromium-$latest.ready.json"

          if rclone lsf "$archive" >/dev/null 2>&1 &&
             rclone lsf "$checksum" >/dev/null 2>&1 &&
             rclone lsf "$ready" >/dev/null 2>&1; then
            ready_revision=$(rclone cat "$ready" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("revision",""))')
            if [ "$ready_revision" = "$latest" ]; then
              echo "Chromium $latest is already fully finalized. The Package matrix will be skipped."
              rclone deletefile "$active_marker" >/dev/null 2>&1 || true
              echo "already_finalized=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "Chromium $latest is not finalized. The Package matrix will run if needed."
          echo "already_finalized=false" >> "$GITHUB_OUTPUT"

  SetupTools:
    needs: ResolveRevision
    if: ${{ needs.ResolveRevision.result == 'success' && needs.ResolveRevision.outputs.already_finalized != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Restore Chromium tools cache
        id: tools-cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/wave-browser/tools/bin
            ~/.cache/wave-browser/tools/depot_tools
          key: wave-chromium-tools-v1-${{ runner.os }}-x64

      - name: Install Chromium tools on cache miss
        if: steps.tools-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tools_root="$HOME/.cache/wave-browser/tools"
          bin_dir="$tools_root/bin"
          depot_tools_dir="$tools_root/depot_tools"
          mkdir -p "$bin_dir"
          rm -rf "$depot_tools_dir"

          tmp_dir=$(mktemp -d)
          trap 'rm -rf "$tmp_dir"' EXIT
          curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o "$tmp_dir/rclone.zip"
          python3 -c 'import sys,zipfile; zip_path,out_dir=sys.argv[1],sys.argv[2]; z=zipfile.ZipFile(zip_path); binary=next(n for n in z.namelist() if n.endswith("/rclone")); z.extract(binary,out_dir); z.close(); print(binary)' "$tmp_dir/rclone.zip" "$tmp_dir"
          install -m 0755 "$(find "$tmp_dir" -type f -name rclone -print -quit)" "$bin_dir/rclone"

          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$depot_tools_dir"

          "$bin_dir/rclone" version
          PATH="$depot_tools_dir:$PATH" gclient --version

      - name: Verify Chromium tools cache
        shell: bash
        run: |
          set -euo pipefail
          test -x "$HOME/.cache/wave-browser/tools/bin/rclone"
          test -x "$HOME/.cache/wave-browser/tools/depot_tools/gclient"
          echo "Chromium tools cache is ready. Package jobs can restore it without reinstalling rclone or depot_tools."

  Package:
    needs: [ResolveRevision, SetupTools]
    if: ${{ needs.ResolveRevision.result == 'success' && needs.ResolveRevision.outputs.already_finalized != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot:
          - 1
          - 2
