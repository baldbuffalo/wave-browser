    env:
      REVISION: ${{ needs.ResolveRevision.outputs.revision }}
      WORK_ROOT: ${{ github.workspace }}/../wave-chromium
      CHECKPOINT_ROOT: WaveBrowser/Chromium/staging/${{ needs.ResolveRevision.outputs.revision }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rclone >/dev/null 2>&1; then
            curl -fsSL https://rclone.org/install.sh | sudo bash
          fi
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zstd
          fi

      - name: Configure OneDrive
        shell: bash
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.WAVE_CHROMIUM_BACKUP_ONEDRIVE }}
        run: |
          set -euo pipefail
          if [ -z "$RCLONE_CONFIG_CONTENT" ]; then
            echo "Missing WAVE_CHROMIUM_BACKUP_ONEDRIVE repository secret."
            exit 1
          fi
          mkdir -p "$HOME/.config/rclone"
          printf '%s\n' "$RCLONE_CONFIG_CONTENT" > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"

      - name: Verify OneDrive is readable
        shell: bash
        run: |
          set -euo pipefail
          rclone lsd onedrive: >/dev/null
          echo "OneDrive remote is readable."

      - name: Check for completed Chromium source
        id: complete
        shell: bash
        run: |
          set -euo pipefail
          source_archive="onedrive:$WAVE_ONEDRIVE_PATH/staging/$REVISION/chromium-$REVISION.source.tar.zst"
          source_ready="onedrive:$WAVE_ONEDRIVE_PATH/staging/$REVISION/source.ready"

          if rclone lsf "$source_archive" >/dev/null 2>&1 && rclone lsf "$source_ready" >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "Full Chromium source and dependencies are already downloaded for $REVISION."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "Chromium $REVISION still needs the full source/dependency download to complete."
          fi

      - name: Restore latest checkpoint from OneDrive
        if: steps.complete.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK_ROOT"
          checkpoint="onedrive:$CHECKPOINT_ROOT/checkpoint.tar.zst"
          ready="onedrive:$CHECKPOINT_ROOT/checkpoint.ready"

          ready_exists=false
          checkpoint_exists=false
          manifest_exists=false
          rclone lsf "$ready" >/dev/null 2>&1 && ready_exists=true || true
          rclone lsf "$checkpoint" >/dev/null 2>&1 && checkpoint_exists=true || true
          rclone lsf "onedrive:$CHECKPOINT_ROOT/checkpoint.json" >/dev/null 2>&1 && manifest_exists=true || true
          if $ready_exists && $checkpoint_exists && $manifest_exists; then
            echo "All checkpoint files exist; restoring the checkpoint."
            rclone cat "$checkpoint" | tar -I 'zstd -T0 -3' -xpf - -C "$WORK_ROOT"
            echo "Checkpoint restored."
          elif ! $ready_exists && ! $checkpoint_exists && ! $manifest_exists; then
            echo "No checkpoint files exist. Starting a new Chromium checkout."
          else
            echo "Incomplete checkpoint detected. Removing incomplete checkpoint files."
            rclone deletefile "$ready" >/dev/null 2>&1 || true
            rclone deletefile "$checkpoint" >/dev/null 2>&1 || true
            rclone deletefile "onedrive:$CHECKPOINT_ROOT/checkpoint.json" >/dev/null 2>&1 || true
            rclone deletefile "onedrive:$CHECKPOINT_ROOT/checkpoint.tar.zst.partial" >/dev/null 2>&1 || true
          fi

      - name: Verify checkpoint files before continuing
        if: steps.complete.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail
          checkpoint="onedrive:$CHECKPOINT_ROOT/checkpoint.tar.zst"
          ready="onedrive:$CHECKPOINT_ROOT/checkpoint.ready"
          manifest="onedrive:$CHECKPOINT_ROOT/checkpoint.json"
          partial="onedrive:$CHECKPOINT_ROOT/checkpoint.tar.zst.partial"

          echo "Checking every OneDrive checkpoint file for this slot..."
          for file in "$checkpoint" "$ready" "$manifest"; do
            if rclone lsf "$file" >/dev/null 2>&1; then
              echo "FOUND: $file"
            else
              echo "MISSING: $file"
            fi
          done

          if rclone lsf "$ready" >/dev/null 2>&1; then
            rclone lsf "$checkpoint" >/dev/null 2>&1 || { echo "checkpoint.ready exists but checkpoint.tar.zst is missing."; exit 1; }
            rclone lsf "$manifest" >/dev/null 2>&1 || { echo "checkpoint.ready exists but checkpoint.json is missing."; exit 1; }
            echo "Checkpoint is complete and safe to restore."
          elif rclone lsf "$checkpoint" >/dev/null 2>&1 || rclone lsf "$manifest" >/dev/null 2>&1; then
            echo "Partial checkpoint state exists, but checkpoint.ready is missing. The restore step will treat it as incomplete."
          else
            echo "No checkpoint exists for this slot."
          fi

          if rclone lsf "$partial" >/dev/null 2>&1; then
            echo "WARNING: an interrupted partial upload exists: $partial"
          fi

      - name: Prepare depot_tools
        if: steps.complete.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/depot_tools:$PATH"

          attempt=1
          while true; do
            rm -rf "$HOME/depot_tools"
            echo "Installing depot_tools (attempt $attempt)..."

            if git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools" &&
               [ -x "$HOME/depot_tools/gclient" ]; then
              echo "depot_tools clone succeeded."
              break
            fi

            echo "depot_tools clone failed or gclient is missing."
            echo "Removing incomplete checkout and retrying in 10 seconds..."
            rm -rf "$HOME/depot_tools"
            attempt=$((attempt + 1))
            sleep 10
          done

          export PATH="$HOME/depot_tools:$PATH"

          # gclient normally auto-updates depot_tools. Disable that automatic
          # update so a transient depot_tools self-update cannot bypass the
          # retry loop and kill this job.
          export DEPOT_TOOLS_UPDATE=0

          # Verify the checkout is usable before allowing Chromium work to start.
          while true; do
            if "$HOME/depot_tools/gclient" --version >/dev/null 2>&1; then
              echo "depot_tools verification succeeded."
              break
            fi

            echo "depot_tools verification failed; reinstalling..."
            rm -rf "$HOME/depot_tools"
            attempt=$((attempt + 1))
            echo "Retrying depot_tools installation (attempt $attempt) in 10 seconds..."
            sleep 10

            while true; do
              if git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools" &&
                 [ -x "$HOME/depot_tools/gclient" ]; then
                break
              fi
              rm -rf "$HOME/depot_tools"
              attempt=$((attempt + 1))
              echo "depot_tools clone failed; retrying in 10 seconds..."
              sleep 10
            done
          done

          echo "$HOME/depot_tools" >> "$GITHUB_PATH"

      - name: Continue Chromium checkout and dependency sync
        if: steps.complete.outputs.already != 'true'
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK_ROOT"
          cd "$WORK_ROOT"

          total_kb=$(df -Pk "$WORK_ROOT" | awk 'NR==2 {print $2}')
          free_kb=$(df -Pk "$WORK_ROOT" | awk 'NR==2 {print $4}')
          start_used_kb=$((total_kb - free_kb))
          budget_kb=$((CHECKPOINT_BUDGET_GIB * 1024 * 1024))
          free_limit_kb=$((CHECKPOINT_FREE_GIB * 1024 * 1024))
          max_safe_used_kb=$((total_kb - free_limit_kb))
          checkpoint_used_kb=$((start_used_kb + budget_kb))
          if (( checkpoint_used_kb > max_safe_used_kb )); then
            checkpoint_used_kb=$max_safe_used_kb
          fi

          echo "Runner disk total: $((total_kb / 1024 / 1024)) GiB"
          echo "Disk used when Chromium work starts: $((start_used_kb / 1024 / 1024)) GiB"
          echo "Checkpoint budget for this runner: $(( (checkpoint_used_kb - start_used_kb) / 1024 / 1024 )) GiB additional"
          echo "Checkpoint threshold: $((checkpoint_used_kb / 1024 / 1024)) GiB used"

          disk_guarded() {
            local command="$1"
            setsid bash -c "$command" &
            local pid=$!

            while kill -0 "$pid" 2>/dev/null; do
              used_kb=$((total_kb - $(df -Pk "$WORK_ROOT" | awk 'NR==2 {print $4}')))
              if (( used_kb >= checkpoint_used_kb )); then
                echo "Checkpoint threshold reached at approximately $((used_kb / 1024 / 1024)) GiB used."
                echo "Stopping the current Chromium operation safely before the runner disk fills."
                kill -TERM -- "-$pid" 2>/dev/null || true
                sleep 5
                kill -KILL -- "-$pid" 2>/dev/null || true
                wait "$pid" || true
                return 75
              fi
              sleep 5
            done

            wait "$pid"
          }

          # A checkpoint may contain gclient metadata without a completed src checkout.
          # Never run fetch when any checkpoint/checkout state exists. If src is missing,
          # gclient sync from WORK_ROOT will recreate the checkout from .gclient metadata.
          if [ ! -d "$WORK_ROOT/src" ] && [ ! -f "$WORK_ROOT/.gclient" ]; then
            rc=0
            disk_guarded 'fetch --no-history --nohooks chromium' || rc=$?
            if [ "$rc" -eq 75 ]; then
              echo "checkpoint=true" >> "$GITHUB_OUTPUT"
              exit 0
            elif [ "$rc" -ne 0 ]; then
              exit "$rc"
            fi
          else
            echo "Existing Chromium checkout/checkpoint metadata detected."
          fi

          if [ -d "$WORK_ROOT/src" ]; then
            cd "$WORK_ROOT/src"

            rc=0
            disk_guarded 'git fetch origin main' || rc=$?
            if [ "$rc" -eq 75 ]; then
              echo "checkpoint=true" >> "$GITHUB_OUTPUT"
              exit 0
            elif [ "$rc" -ne 0 ]; then
              exit "$rc"
            fi

            rc=0
            disk_guarded 'git checkout --detach "$REVISION"' || rc=$?
            if [ "$rc" -eq 75 ]; then
              echo "checkpoint=true" >> "$GITHUB_OUTPUT"
              exit 0
            elif [ "$rc" -ne 0 ]; then
              exit "$rc"
            fi
          else
            echo "Chromium src checkout is not present yet; gclient sync will create/restore it from .gclient metadata."
          fi

          cd "$WORK_ROOT"

          rc=0
          disk_guarded 'gclient sync --nohooks --process-all-deps --revision "src@$REVISION"' || rc=$?
          if [ "$rc" -eq 75 ]; then
            echo "checkpoint=true" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

          echo "checkpoint=false" >> "$GITHUB_OUTPUT"
          echo "Chromium source and dependencies completed for $REVISION."

      - name: Save checkpoint to OneDrive
        if: steps.complete.outputs.already != 'true' && steps.sync.outputs.checkpoint == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK_ROOT"
          checkpoint="onedrive:$CHECKPOINT_ROOT/checkpoint.tar.zst"
          partial="onedrive:$CHECKPOINT_ROOT/checkpoint.tar.zst.partial"
          ready="onedrive:$CHECKPOINT_ROOT/checkpoint.ready"
          manifest="onedrive:$CHECKPOINT_ROOT/checkpoint.json"

          rclone deletefile "$partial" >/dev/null 2>&1 || true
          rclone deletefile "$ready" >/dev/null 2>&1 || true

          echo "Streaming the current Chromium state to OneDrive..."
          tar -C "$WORK_ROOT" -cf - . | zstd -T0 -3 | rclone rcat "$partial" --progress

          rclone moveto "$partial" "$checkpoint"

          printf '{"revision":"%s","format":"tar.zst","checkpoint_slot":"%s"}\n' "$REVISION" "${{ matrix.slot }}" |
            rclone rcat "$manifest"

          rclone lsf "$checkpoint" >/dev/null
          rclone lsf "$manifest" >/dev/null
          printf 'ready\n' | rclone rcat "$ready"
          rclone lsf "$ready" >/dev/null
          echo "Checkpoint saved with all required files. The next GitHub-hosted runner will restore it and continue."

      - name: Save completed Chromium source for Finalize
        if: steps.complete.outputs.already != 'true' && steps.sync.outputs.checkpoint == 'false'
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK_ROOT"

          source_archive="onedrive:$WAVE_ONEDRIVE_PATH/staging/$REVISION/chromium-$REVISION.source.tar.zst"
          source_partial="onedrive:$WAVE_ONEDRIVE_PATH/staging/$REVISION/chromium-$REVISION.source.tar.zst.partial"
          source_ready="onedrive:$WAVE_ONEDRIVE_PATH/staging/$REVISION/source.ready"
          source_manifest="onedrive:$WAVE_ONEDRIVE_PATH/staging/$REVISION/source.json"

          rclone deletefile "$source_partial" >/dev/null 2>&1 || true
          rclone deletefile "$source_ready" >/dev/null 2>&1 || true

          echo "Chromium source/dependencies are complete. Saving them for Finalize to package..."
          tar -C "$WORK_ROOT" -cf - \
            --exclude='./src/out' \
            --exclude='./src/.cipd' \
            --exclude='./src/.git' \
            .gclient .gclient_entries src |
            zstd -T0 -3 | rclone rcat "$source_partial" --progress

          rclone moveto "$source_partial" "$source_archive"
          printf '{"revision":"%s","complete":true}\n' "$REVISION" | rclone rcat "$source_manifest"
          rclone lsf "$source_archive" >/dev/null
          rclone lsf "$source_manifest" >/dev/null
          printf 'ready\n' | rclone rcat "$source_ready"
          rclone lsf "$source_ready" >/dev/null
          echo "Completed Chromium source saved. Finalize can now create the final tar.gz package."

      - name: Cancel remaining package slots after completion
        if: ${{ steps.complete.outputs.already == 'true' || (steps.complete.outputs.already != 'true' && steps.sync.outputs.checkpoint == 'false') }}
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_PACKAGE_JOB: Package (${{ matrix.slot }})
        shell: bash
        run: |
          set -euo pipefail
          echo "Chromium package is complete. Cancelling remaining Package matrix jobs so Finalize can verify it."

          for attempt in {1..10}; do
            remaining=$(
              gh api --paginate --slurp \
                "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" |
              jq -r --arg current "$CURRENT_PACKAGE_JOB" \
                '.[] | .jobs[] |
                 select(.name | startswith("Package (")) |
                 select(.name != $current) |
                 select(.status == "queued" or .status == "in_progress") |
                 .id' || true
            )

            if [ -z "$remaining" ]; then
              echo "No remaining queued/in-progress Package jobs found."
              break
            fi

            while read -r job_id; do
              [ -n "$job_id" ] || continue
              echo "Cancelling Package job $job_id..."
              gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/cancel" >/dev/null 2>&1 || true
            done <<< "$remaining"

            sleep 2
          done

          echo "Remaining package slots have been cancelled. Finalize will verify the OneDrive package."

  Finalize:
    needs: [ResolveRevision, Package]
    if: ${{ always() && github.run_attempt == 1 && needs.ResolveRevision.result == 'success' && (needs.Package.result == 'success' || needs.Package.result == 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install rclone
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rclone >/dev/null 2>&1; then
            curl -fsSL https://rclone.org/install.sh | sudo bash
          fi

      - name: Configure OneDrive
        shell: bash
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.WAVE_CHROMIUM_BACKUP_ONEDRIVE }}
        run: |
          set -euo pipefail
          if [ -z "$RCLONE_CONFIG_CONTENT" ]; then
            echo "Missing WAVE_CHROMIUM_BACKUP_ONEDRIVE repository secret."
            exit 1
          fi
          mkdir -p "$HOME/.config/rclone"
          printf '%s\n' "$RCLONE_CONFIG_CONTENT" > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"

      - name: Restore complete Chromium source and create final package
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ needs.ResolveRevision.outputs.revision }}
          ORIGINAL_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail

          source_root="onedrive:$WAVE_ONEDRIVE_PATH/staging/$REVISION"
          source_archive="$source_root/chromium-$REVISION.source.tar.zst"
          source_ready="$source_root/source.ready"
          work_root="$RUNNER_TEMP/wave-chromium"
          archive="onedrive:$WAVE_ONEDRIVE_PATH/chromium-$REVISION.tar.gz"
          checksum="onedrive:$WAVE_ONEDRIVE_PATH/chromium-$REVISION.sha256"

          source_complete() {
            rclone lsf "$source_archive" >/dev/null 2>&1 &&
            rclone lsf "$source_ready" >/dev/null 2>&1
          }

          if ! source_complete; then
            echo "Complete Chromium source is not present yet."
            echo "Re-running cancelled Package jobs one at a time until the full download is complete."

            declare -A tried_jobs=()

            while ! source_complete; do
              job_id=$(
                gh api --paginate --slurp                   "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${ORIGINAL_ATTEMPT}/jobs?per_page=100" |
                jq -r '.[] | .jobs[] | select(.name | startswith("Package (")) | select(.conclusion == "cancelled") | .id' |
                while read -r candidate; do
                  [ -n "$candidate" ] || continue
                  if [ -z "${tried_jobs[$candidate]+x}" ]; then
                    echo "$candidate"
                    break
                  fi
                done
              )

              if [ -z "$job_id" ]; then
                echo "No unused cancelled Package jobs remain, but the full Chromium source is still missing."
                exit 1
              fi

              tried_jobs["$job_id"]=1
              echo "Re-running cancelled Package job $job_id to continue the Chromium download..."
              gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/jobs/$job_id/rerun" >/dev/null

              status=""
              for poll in {1..2160}; do
                status=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/jobs/$job_id" --jq '.status')
                conclusion=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/jobs/$job_id" --jq '.conclusion // ""')
                if [ "$status" = "completed" ]; then
                  echo "Package job $job_id completed with conclusion: $conclusion"
                  break
                fi
                sleep 10
              done

              if [ "$status" != "completed" ]; then
                echo "Timed out waiting for Package job $job_id."
                continue
              fi
            done
          fi

          echo "Full Chromium source is ready. Restoring it on the Finalize runner..."
          mkdir -p "$work_root"
          rclone cat "$source_archive" | zstd -d | tar -xpf - -C "$work_root"

          test -d "$work_root/src"
          test -f "$work_root/.gclient"
          test -f "$work_root/.gclient_entries"

          echo "Creating final Chromium tar.gz package from the verified source..."
          rm -f "$RUNNER_TEMP/chromium-$REVISION.tar.gz"
          tar -C "$work_root" -czf "$RUNNER_TEMP/chromium-$REVISION.tar.gz"             --exclude='./src/out'             --exclude='./src/.cipd'             --exclude='./src/.git'             .gclient .gclient_entries src

          echo "Uploading final Chromium package to OneDrive..."
          rclone copyto "$RUNNER_TEMP/chromium-$REVISION.tar.gz" "$archive"

          hash=$(sha256sum "$RUNNER_TEMP/chromium-$REVISION.tar.gz" | awk '{print $1}')
          printf '%s  chromium-%s.tar.gz\n' "$hash" "$REVISION" | rclone rcat "$checksum"

          echo "Verifying final package..."
          rclone lsf "$archive" >/dev/null
          rclone lsf "$checksum" >/dev/null

          expected_hash=$(rclone cat "$checksum" | awk '{print $1}')
          actual_hash=$(rclone cat "$archive" | sha256sum | awk '{print $1}')
          test -n "$expected_hash"
          test "$expected_hash" = "$actual_hash"

          rclone cat "$archive" | tar -tzf - >/dev/null
          echo "Final Chromium package is checksum-valid and structurally readable."

          echo "Removing temporary source/checkpoint data after successful packaging..."
          rclone deletefile "$source_archive" >/dev/null 2>&1 || true
          rclone deletefile "$source_root/chromium-$REVISION.source.tar.zst.partial" >/dev/null 2>&1 || true
          rclone deletefile "$source_ready" >/dev/null 2>&1 || true
          rclone deletefile "$source_root/source.json" >/dev/null 2>&1 || true
          rclone deletefile "$source_root/checkpoint.tar.zst" >/dev/null 2>&1 || true
          rclone deletefile "$source_root/checkpoint.tar.zst.partial" >/dev/null 2>&1 || true
          rclone deletefile "$source_root/checkpoint.ready" >/dev/null 2>&1 || true
          rclone deletefile "$source_root/checkpoint.json" >/dev/null 2>&1 || true
          echo "OneDrive temporary source/checkpoint cleanup complete."

      - name: Commit Chromium revision
        shell: bash
        env:
          REVISION: ${{ needs.ResolveRevision.outputs.revision }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' "$REVISION" > android/chromium_revision.txt
          printf '%s\n' "$REVISION" > windows/chromium_revision.txt
          git add android/chromium_revision.txt windows/chromium_revision.txt
          git diff --cached --quiet || git commit -m "Update Chromium revision"
          git push

      - name: Summary
        env:
          REVISION: ${{ needs.ResolveRevision.outputs.revision }}
        run: |
          echo "Chromium $REVISION is fully packaged in OneDrive."
          echo "The source download used serial GitHub-hosted runners with OneDrive checkpoints."

      - name: Prepare platform build handoff
        shell: bash
        env:
          REVISION: ${{ needs.ResolveRevision.outputs.revision }}
        run: |
          set -euo pipefail

          archive="onedrive:$WAVE_ONEDRIVE_PATH/chromium-$REVISION.tar.gz"
          checksum="onedrive:$WAVE_ONEDRIVE_PATH/chromium-$REVISION.sha256"

          rclone lsf "$archive" >/dev/null
          rclone lsf "$checksum" >/dev/null

          printf '{"revision":"%s","source_archive":"chromium-%s.tar.gz","checksum":"chromium-%s.sha256","ready_for_platform_builds":true}\n' \
            "$REVISION" "$REVISION" "$REVISION" |
            rclone rcat "onedrive:$WAVE_ONEDRIVE_PATH/chromium-$REVISION.ready.json"

          echo "Chromium $REVISION is ready for platform-specific compilation."
          echo "Android and Windows workflows will restore this verified source package and compile their own platform engine."
