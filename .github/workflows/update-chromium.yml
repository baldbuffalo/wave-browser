    env:
      REVISION: ${{ needs.ResolveRevision.outputs.revision }}
      SLOT: ${{ matrix.slot }}
      WORK_ROOT: ${{ github.workspace }}/../wave-chromium
      CHECKPOINT_ROOT: WaveBrowser/Chromium/staging/${{ needs.ResolveRevision.outputs.revision }}
    steps:
      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rclone >/dev/null 2>&1; then
            tmp_dir=$(mktemp -d)
            trap 'rm -rf "$tmp_dir"' EXIT
            curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o "$tmp_dir/rclone.zip"
            python3 -c 'import sys,zipfile; zip_path,out_dir=sys.argv[1],sys.argv[2]; z=zipfile.ZipFile(zip_path); binary=next(n for n in z.namelist() if n.endswith("/rclone")); z.extract(binary,out_dir); z.close(); print(binary)' "$tmp_dir/rclone.zip" "$tmp_dir"
            sudo install -m 0755 "$(find "$tmp_dir" -type f -name rclone -print -quit)" /usr/local/bin/rclone
            rclone version
          fi

      - name: Install depot_tools
        shell: bash
        run: |
          set -euo pipefail
          depot_tools_dir="$RUNNER_TEMP/depot_tools"
          rm -rf "$depot_tools_dir"
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$depot_tools_dir"
          echo "$depot_tools_dir" >> "$GITHUB_PATH"
          export PATH="$depot_tools_dir:$PATH"
          command -v gclient
          gclient --version

      - name: Configure OneDrive
        shell: bash
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.WAVE_CHROMIUM_BACKUP_ONEDRIVE }}
        run: |
          set -euo pipefail
          if [ -z "$RCLONE_CONFIG_CONTENT" ]; then
            echo "Missing WAVE_CHROMIUM_BACKUP_ONEDRIVE repository secret."
            exit 1
          fi
          mkdir -p "$HOME/.config/rclone"
          printf '%s\n' "$RCLONE_CONFIG_CONTENT" > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"

      - name: Check for completed Chromium source
        id: complete
        shell: bash
        run: |
          set -euo pipefail
          source_archive="onedrive:$WAVE_ONEDRIVE_PATH/staging/$REVISION/chromium-$REVISION.source.tar.zst"
          source_ready="onedrive:$WAVE_ONEDRIVE_PATH/staging/$REVISION/source.ready"
          source_manifest="onedrive:$WAVE_ONEDRIVE_PATH/staging/$REVISION/source.json"

          if rclone lsf "$source_archive" >/dev/null 2>&1 &&
             rclone lsf "$source_ready" >/dev/null 2>&1 &&
             rclone lsf "$source_manifest" >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "Full Chromium source and dependencies are already downloaded for $REVISION."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "Chromium $REVISION still needs the full source/dependency download to complete."
          fi

      - name: Restore latest checkpoint from OneDrive
        if: steps.complete.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK_ROOT"
          checkpoint="onedrive:$CHECKPOINT_ROOT/checkpoint.tar.zst"
          ready="onedrive:$CHECKPOINT_ROOT/checkpoint.ready"
          manifest="onedrive:$CHECKPOINT_ROOT/checkpoint.json"
          uploading="onedrive:$CHECKPOINT_ROOT/checkpoint.uploading"

          restore_complete_checkpoint() {
            local ready_content="$1" generation
            generation=$(printf '%s\n' "$ready_content" | cut -d'|' -f2)
            local parts_root="onedrive:$CHECKPOINT_ROOT/checkpoint-parts-$generation"
            local parts_dir="$RUNNER_TEMP/checkpoint-parts-restore"
            echo "Restoring completed checkpoint generation: $generation"
            rm -rf "$parts_dir"; mkdir -p "$parts_dir"
            rclone copy "$parts_root" "$parts_dir" --transfers 4 --checkers 4 --no-traverse --stats=10s --stats-one-line
            local part_count
            part_count=$(find "$parts_dir" -maxdepth 1 -type f -name 'part-*' | wc -l)
            test "$part_count" -gt 0
            (find "$parts_dir" -maxdepth 1 -type f -name 'part-*' -printf '%f\n' | sort | while read -r part; do cat "$parts_dir/$part"; done) |
              tar -I 'zstd -T0 -3' -xpf - -C "$WORK_ROOT"
            rm -rf "$parts_dir"
          }

          download_uploading_checkpoint() {
            local marker="$1" generation
            generation=$(printf '%s\n' "$marker" | cut -d'|' -f2)
            local parts_root="onedrive:$CHECKPOINT_ROOT/checkpoint-parts-$generation"
            local parts_dir="$RUNNER_TEMP/checkpoint-parts-restore"
            echo "Downloading checkpoint $generation while the previous worker uploads it..."
            rm -rf "$parts_dir"; mkdir -p "$parts_dir"
            while true; do
              rclone copy "$parts_root" "$parts_dir" --transfers 4 --checkers 4 --no-traverse --ignore-existing --stats=10s --stats-one-line || true
              if rclone lsf "$ready" >/dev/null 2>&1 && [ "$(rclone cat "$ready" 2>/dev/null || true)" = "parts|$generation" ]; then break; fi
              if ! rclone lsf "$uploading" >/dev/null 2>&1; then echo "Checkpoint upload marker disappeared before this generation became ready."; exit 1; fi
              sleep 5
            done
            rclone copy "$parts_root" "$parts_dir" --transfers 4 --checkers 4 --no-traverse --ignore-existing --stats=10s --stats-one-line
            local expected_parts actual_parts
            expected_parts=$(rclone cat "$manifest" | python3 -c 'import json,sys; print(json.load(sys.stdin)["parts"])')
            actual_parts=$(find "$parts_dir" -maxdepth 1 -type f -name 'part-*' | wc -l)
            test "$actual_parts" -eq "$expected_parts"
            echo "Checkpoint download finished: $actual_parts/$expected_parts parts were downloaded while the previous job was uploading."
            (find "$parts_dir" -maxdepth 1 -type f -name 'part-*' -printf '%f\n' | sort | while read -r part; do cat "$parts_dir/$part"; done) |
              tar -I 'zstd -T0 -3' -xpf - -C "$WORK_ROOT"
            rm -rf "$parts_dir"
          }

          if [ "$SLOT" -gt 1 ]; then
            while true; do
              if rclone lsf "$uploading" >/dev/null 2>&1; then
                marker=$(rclone cat "$uploading")
                [[ "$marker" == parts\|* ]] && { download_uploading_checkpoint "$marker"; break; }
              elif rclone lsf "$ready" >/dev/null 2>&1; then
                ready_content=$(rclone cat "$ready")
                [[ "$ready_content" == parts\|* ]] && { restore_complete_checkpoint "$ready_content"; break; }
              elif rclone lsf "$checkpoint" >/dev/null 2>&1 && rclone lsf "$ready" >/dev/null 2>&1 && rclone lsf "$manifest" >/dev/null 2>&1; then
                rclone cat "$checkpoint" | tar -I 'zstd -T0 -3' -xpf - -C "$WORK_ROOT"; break
              else
                echo "Waiting for the previous worker to publish its checkpoint upload marker..."
              fi
              sleep 5
            done
          else
            ready_content=""
            if rclone lsf "$ready" >/dev/null 2>&1; then ready_content=$(rclone cat "$ready"); fi
            if [[ "$ready_content" == parts\|* ]]; then
              restore_complete_checkpoint "$ready_content"
            elif rclone lsf "$checkpoint" >/dev/null 2>&1 && rclone lsf "$ready" >/dev/null 2>&1 && rclone lsf "$manifest" >/dev/null 2>&1; then
              rclone cat "$checkpoint" | tar -I 'zstd -T0 -3' -xpf - -C "$WORK_ROOT"
            elif ! rclone lsf "$ready" >/dev/null 2>&1 && ! rclone lsf "$checkpoint" >/dev/null 2>&1 && ! rclone lsf "$manifest" >/dev/null 2>&1; then
              echo "No checkpoint files exist. Starting a new Chromium checkout."
            else
              rclone deletefile "$ready" >/dev/null 2>&1 || true
              rclone deletefile "$checkpoint" >/dev/null 2>&1 || true
              rclone deletefile "$manifest" >/dev/null 2>&1 || true
              rclone deletefile "onedrive:$CHECKPOINT_ROOT/checkpoint.json.partial" >/dev/null 2>&1 || true
            fi
          fi

          if [ ! -f "$WORK_ROOT/.gclient" ] || [ ! -d "$WORK_ROOT/src/.git" ]; then
            rm -rf "$WORK_ROOT"; mkdir -p "$WORK_ROOT"
          else
            echo "Checkpoint restore/download complete and checkout metadata verified."
          fi
      - name: Continue Chromium checkout and dependency sync
        if: steps.complete.outputs.already != 'true'
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK_ROOT"
          cd "$WORK_ROOT"

          # The standard runner image consumes substantial disk before the Chromium
          # checkout starts, and df exposes the full backing filesystem. Track the
          # disk growth caused by Chromium work from this point instead of rescanning
          # the entire checkout with du. This keeps the guard cheap enough to run
          # during a large git clone.
          export GCLIENT_CACHE_DIR="$WORK_ROOT/.gclient_cache"

          start_free_kb=$(df -Pk "$WORK_ROOT" | awk 'NR==2 {print $4}')
          used_limit_kb=$((CHECKPOINT_USED_GIB * 1024 * 1024))
          start_free_gib=$((start_free_kb / 1024 / 1024))

          echo "Runner filesystem view: $(df -h "$WORK_ROOT" | awk 'NR==2 {print $2 " total, " $3 " used, " $4 " free"}')"
          echo "Disk available when Chromium work starts: ${start_free_gib} GiB"
          echo "Chromium additional-disk checkpoint threshold: $CHECKPOINT_USED_GIB GiB"
          echo "Checkpointing when Chromium work consumes approximately $CHECKPOINT_USED_GIB GiB of additional disk."

          disk_guarded() {
            local command="$1"
            setsid bash -c "$command" &
            local pid=$!
            local last_reported_gib=-1

            while kill -0 "$pid" 2>/dev/null; do
              current_free_kb=$(df -Pk "$WORK_ROOT" | awk 'NR==2 {print $4}')
              growth_kb=$((start_free_kb - current_free_kb))
              if (( growth_kb < 0 )); then
                growth_kb=0
              fi

              current_growth_gib=$((growth_kb / 1024 / 1024))
              if (( current_growth_gib != last_reported_gib )); then
                echo "Chromium disk growth since sync start: ${current_growth_gib} GiB"
                last_reported_gib="$current_growth_gib"
              fi

              if (( growth_kb >= used_limit_kb )); then
                echo "Chromium work has consumed approximately ${current_growth_gib} GiB of additional disk."
                echo "Stopping the current Chromium operation safely so this runner can checkpoint to OneDrive."
                kill -TERM -- "-$pid" 2>/dev/null || true
                sleep 5
                kill -KILL -- "-$pid" 2>/dev/null || true
                wait "$pid" || true
                return 75
              fi
              sleep 5
            done

            wait "$pid"
          }

          # Do not use depot_tools fetch for the initial src download. fetch creates
          # a temporary clone and only renames it to src after the clone completes,
          # so a checkpoint taken during that clone cannot resume it.
          # Instead, create the gclient config and fetch Chromium directly into src.
          # A partial src/.git repository survives checkpoint/restore.
          if [ ! -f "$WORK_ROOT/.gclient" ]; then
            rc=0
            disk_guarded 'gclient config --name src --custom-var=checkout_src_internal=False --custom-var=checkout_agents_internal=False "$CHROMIUM_URL"' || rc=$?
            if [ "$rc" -eq 75 ]; then
              echo "checkpoint=true" >> "$GITHUB_OUTPUT"
              exit 0
            elif [ "$rc" -ne 0 ]; then
              exit "$rc"
            fi
          fi

          if [ ! -d "$WORK_ROOT/src/.git" ]; then
            mkdir -p "$WORK_ROOT/src"
            git -C "$WORK_ROOT/src" init -b main
            git -C "$WORK_ROOT/src" remote add origin "$CHROMIUM_URL"
          elif ! git -C "$WORK_ROOT/src" remote get-url origin >/dev/null 2>&1; then
            git -C "$WORK_ROOT/src" remote add origin "$CHROMIUM_URL"
          fi

          rc=0
          disk_guarded 'git -C "$WORK_ROOT/src" fetch --no-tags --depth=1 origin "$REVISION"' || rc=$?
          if [ "$rc" -eq 75 ]; then
            echo "checkpoint=true" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

          rc=0
          disk_guarded 'git -C "$WORK_ROOT/src" checkout --detach "$REVISION"' || rc=$?
          if [ "$rc" -eq 75 ]; then
            echo "checkpoint=true" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

          cd "$WORK_ROOT"

          # Older checkpoints may contain a .gclient generated without the
          # public-only custom variables. Recreate the config with gclient's
          # supported config command so custom_vars is a normal dictionary in
          # the generated file. This is also idempotent across resumed slots.
          rm -f "$WORK_ROOT/.gclient"
          rc=0
          disk_guarded 'gclient config --name src --custom-var=checkout_src_internal=False --custom-var=checkout_agents_internal=False "$CHROMIUM_URL"' || rc=$?
          if [ "$rc" -eq 75 ]; then
            echo "checkpoint=true" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

          # A previous failed sync can leave private-repository scratch directories
          # behind. They are not part of the public Chromium checkout and must not
          # be carried into the completed source package.
          rm -rf "$WORK_ROOT/src/agents/internal" "$WORK_ROOT/_bad_scm"

          rc=0
          disk_guarded 'gclient sync --nohooks --no-history --revision "src@$REVISION"' || rc=$?
          if [ "$rc" -eq 75 ]; then
            echo "checkpoint=true" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

          echo "checkpoint=false" >> "$GITHUB_OUTPUT"
          echo "Chromium source and dependencies completed for $REVISION."

      - name: Save checkpoint to OneDrive
        if: steps.complete.outputs.already != 'true' && steps.sync.outputs.checkpoint == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK_ROOT"
          checkpoint="onedrive:$CHECKPOINT_ROOT/checkpoint.tar.zst"
          ready="onedrive:$CHECKPOINT_ROOT/checkpoint.ready"
          manifest="onedrive:$CHECKPOINT_ROOT/checkpoint.json"
          manifest_partial="onedrive:$CHECKPOINT_ROOT/checkpoint.json.partial"

          old_ready=""
          if rclone lsf "$ready" >/dev/null 2>&1; then
            old_ready=$(rclone cat "$ready")
          fi

          generation="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$(date +%s)"
          parts_root="onedrive:$CHECKPOINT_ROOT/checkpoint-parts-$generation"
          uploading="onedrive:$CHECKPOINT_ROOT/checkpoint.uploading"
          printf 'parts|%s|slot|%s\n' "$generation" "$SLOT" | rclone rcat "$uploading"
          echo "Published checkpoint upload marker for slot $SLOT: $generation"
          batch_dir="$RUNNER_TEMP/checkpoint-parts-upload"
          rm -rf "$batch_dir"
          mkdir -p "$batch_dir"

          # Start each 250 MiB part upload immediately. Keep at most four
          # uploads/parts outstanding so local checkpoint data stays within the
          # runner's ~1 GiB safety headroom while upload overlaps compression.
          upload_pids=()
          upload_parts=()

          wait_for_uploads() {
            local i
            for i in "${!upload_pids[@]}"; do
              wait "${upload_pids[$i]}"
              rm -f "${upload_parts[$i]}"
            done
            upload_pids=()
            upload_parts=()
          }

          start_part_upload() {
            local part_path="$1"
            local part_name="$2"
            echo "Starting OneDrive upload: $part_name"
            # copy uploads the individual file into the checkpoint directory.
            # copyto treats the destination as a file and can collide with the
            # OneDrive directory when that directory is created concurrently.
            rclone copy "$part_path" "$parts_root" \
              --no-check-dest \
              --no-traverse \
              --onedrive-chunk-size 250M \
              --stats=10s \
              --stats-one-line &
            upload_pids+=("$!")
            upload_parts+=("$part_path")
          }

          echo "Streaming Chromium state into pipelined 250 MiB OneDrive checkpoint parts..."
          part_index=0

          tar -C "$WORK_ROOT" -cf - --exclude='./.gclient_cache' . |
            zstd -T0 -1 |
            while true; do
              printf -v part_name "part-%06d" "$part_index"
              part_path="$batch_dir/$part_name"

              dd iflag=fullblock bs=250M count=1 status=none of="$part_path"

              if [ ! -s "$part_path" ]; then
                rm -f "$part_path"
                break
              fi

              part_index=$((part_index + 1))
              start_part_upload "$part_path" "$part_name"

              if (( ${#upload_pids[@]} == 4 )); then
                wait_for_uploads
              fi
            done

          wait_for_uploads
          rm -rf "$batch_dir"

          part_count=$(rclone lsf "$parts_root/" --files-only | grep -c '^part-' || true)
          if [ "$part_count" -eq 0 ]; then
            echo "ERROR: no checkpoint parts were uploaded."
            exit 1
          fi

          echo "Uploaded $part_count checkpoint parts."

          rclone deletefile "$manifest_partial" >/dev/null 2>&1 || true
          printf '{"revision":"%s","format":"tar.zst.parts","generation":"%s","part_size":"250M","parts":%s}\n' \
            "$REVISION" "$generation" "$part_count" |
            rclone rcat "$manifest_partial"

          rclone moveto "$manifest_partial" "$manifest"

          # Publish the ready pointer last. Until this exists, the previous valid
          # checkpoint remains the one used by the restore step.
          printf 'parts|%s\n' "$generation" | rclone rcat "$ready"

          test "$(rclone cat "$ready")" = "parts|$generation"
          rclone lsf "$manifest" >/dev/null
          rclone lsf "$parts_root/" >/dev/null
          rclone deletefile "$uploading" >/dev/null 2>&1 || true

          # The new checkpoint is valid. Only now remove the previous checkpoint.
          if [[ "$old_ready" == parts\|* ]]; then
            old_generation=$(printf '%s\n' "$old_ready" | cut -d'|' -f2-)
            if [ "$old_generation" != "$generation" ]; then
              echo "Removing previous multipart checkpoint: $old_generation"
              rclone purge "onedrive:$CHECKPOINT_ROOT/checkpoint-parts-$old_generation" >/dev/null 2>&1 || true
            fi
          elif [ "$old_ready" = "ready" ]; then
            echo "Removing previous legacy single-file checkpoint now that the new checkpoint is ready."
            rclone deletefile "$checkpoint" >/dev/null 2>&1 || true
          fi

          echo "Checkpoint saved as $part_count parallel OneDrive parts and published atomically."
      - name: Save completed Chromium source for Finalize
        if: steps.complete.outputs.already != 'true' && steps.sync.outputs.checkpoint == 'false'
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK_ROOT"

          source_archive="onedrive:$WAVE_ONEDRIVE_PATH/staging/$REVISION/chromium-$REVISION.source.tar.zst"
          source_partial="onedrive:$WAVE_ONEDRIVE_PATH/staging/$REVISION/chromium-$REVISION.source.tar.zst.partial"
          source_ready="onedrive:$WAVE_ONEDRIVE_PATH/staging/$REVISION/source.ready"
          source_manifest="onedrive:$WAVE_ONEDRIVE_PATH/staging/$REVISION/source.json"

          rclone deletefile "$source_partial" >/dev/null 2>&1 || true
          rclone deletefile "$source_ready" >/dev/null 2>&1 || true

          echo "Chromium source/dependencies are complete. Saving them for Finalize to package..."
          tar -C "$WORK_ROOT" -cf - \
            --exclude='./src/out' \
            --exclude='./src/.cipd' \
            --exclude='*/.git' \
            --exclude='./.gclient_cache' \
            .gclient .gclient_entries src |
            zstd -T0 -1 | rclone rcat "$source_partial" --progress --stats=10s --stats-one-line --onedrive-chunk-size 250M

          rclone moveto "$source_partial" "$source_archive"
          printf '{"revision":"%s","complete":true}\n' "$REVISION" | rclone rcat "$source_manifest"
          rclone lsf "$source_archive" >/dev/null
          rclone lsf "$source_manifest" >/dev/null
          printf 'ready\n' | rclone rcat "$source_ready"
          rclone lsf "$source_ready" >/dev/null
          echo "Completed Chromium source saved. Finalize can now create the final tar.gz package."

  Finalize:
    needs: ResolveRevision
    if: ${{ needs.ResolveRevision.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install rclone and progress tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rclone >/dev/null 2>&1; then
            tmp_dir=$(mktemp -d)
            trap 'rm -rf "$tmp_dir"' EXIT
            curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o "$tmp_dir/rclone.zip"
            python3 -c 'import sys,zipfile; zip_path,out_dir=sys.argv[1],sys.argv[2]; z=zipfile.ZipFile(zip_path); binary=next(n for n in z.namelist() if n.endswith("/rclone")); z.extract(binary,out_dir); z.close(); print(binary)' "$tmp_dir/rclone.zip" "$tmp_dir"

            sudo install -m 0755 "$(find "$tmp_dir" -type f -name rclone -print -quit)" /usr/local/bin/rclone
          fi
          if ! command -v pv >/dev/null 2>&1; then
            sudo apt-get update
            # Remove only known malformed manual pages before the package trigger runs.
            sudo rm -f               /usr/share/man/man1/run-clang-tidy-16.1.gz               /usr/share/man/man1/git-clang-format-16.1.gz               /usr/share/man/man1/run-clang-tidy-17.1.gz               /usr/share/man/man1/git-clang-format-17.1.gz               /usr/share/man/man1/run-clang-tidy-18.1.gz               /usr/share/man/man1/git-clang-format-18.1.gz               /usr/share/man/man1/walinuxagent.1.gz               /usr/share/man/man1/debconf-apt-progress.1.gz               /usr/share/man/man1/debconf-communicate.1.gz               /usr/share/man/man1/debconf-copydb.1.gz               /usr/share/man/man1/debconf-escape.1.gz               /usr/share/man/man1/debconf-set-selections.1.gz               /usr/share/man/man1/debconf-show.1.gz               /usr/share/man/man7/man.7.gz               /usr/share/man/man7/parallel_book.7.gz               /usr/share/man/man7/parallel_design.7.gz               /usr/share/man/man7/parallel_examples.7.gz               /usr/share/man/man7/parallel_tutorial.7.gz
            sudo rm -f               /usr/share/man/ru/man1/debconf-apt-progress.1.gz               /usr/share/man/ru/man1/debconf-communicate.1.gz               /usr/share/man/ru/man1/debconf-copydb.1.gz               /usr/share/man/ru/man1/debconf-escape.1.gz               /usr/share/man/ru/man1/debconf-set-selections.1.gz               /usr/share/man/ru/man1/debconf-show.1.gz               /usr/share/man/ru/man1/debconf.1.gz               /usr/share/man/ru/man8/dpkg-preconfigure.8.gz               /usr/share/man/ru/man8/dpkg-reconfigure.8.gz
            sudo apt-get install -y pv
          fi

      - name: Configure OneDrive
        shell: bash
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.WAVE_CHROMIUM_BACKUP_ONEDRIVE }}
        run: |
          set -euo pipefail
          if [ -z "$RCLONE_CONFIG_CONTENT" ]; then
            echo "Missing WAVE_CHROMIUM_BACKUP_ONEDRIVE repository secret."
            exit 1
          fi
          mkdir -p "$HOME/.config/rclone"
          printf '%s\n' "$RCLONE_CONFIG_CONTENT" > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"

      - name: Check whether Chromium revision is already finalized
        id: finalized
        env:
          REVISION: ${{ needs.ResolveRevision.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          archive="onedrive:$WAVE_ONEDRIVE_PATH/chromium-$REVISION.tar.gz"
          checksum="onedrive:$WAVE_ONEDRIVE_PATH/chromium-$REVISION.sha256"
          ready="onedrive:$WAVE_ONEDRIVE_PATH/chromium-$REVISION.ready.json"

          if rclone lsf "$archive" >/dev/null 2>&1 &&
             rclone lsf "$checksum" >/dev/null 2>&1 &&
             rclone lsf "$ready" >/dev/null 2>&1; then
            ready_revision=$(rclone cat "$ready" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("revision",""))')
            if [ "$ready_revision" = "$REVISION" ]; then
              echo "Chromium $REVISION is already fully finalized. Nothing else is required."
              echo "already=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "Chromium $REVISION is not finalized yet. Finalize will continue."
          echo "already=false" >> "$GITHUB_OUTPUT"

      - name: Restore complete Chromium source and create final package
        if: steps.finalized.outputs.already != 'true'
        env:
          REVISION: ${{ needs.ResolveRevision.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail

          source_root="onedrive:$WAVE_ONEDRIVE_PATH/staging/$REVISION"
          source_archive="$source_root/chromium-$REVISION.source.tar.zst"
          source_ready="$source_root/source.ready"
          source_manifest="$source_root/source.json"
          work_root="$RUNNER_TEMP/wave-chromium"
          archive="onedrive:$WAVE_ONEDRIVE_PATH/chromium-$REVISION.tar.gz"
          checksum="onedrive:$WAVE_ONEDRIVE_PATH/chromium-$REVISION.sha256"

          source_complete() {
            rclone lsf "$source_archive" >/dev/null 2>&1 &&
            rclone lsf "$source_ready" >/dev/null 2>&1 &&
            rclone lsf "$source_manifest" >/dev/null 2>&1
          }

          echo "Finalize is waiting for the completed Chromium source marker from the Package matrix..."

          # Finalize is intentionally independent of the 256-job Package matrix.
          # GitHub waits for every matrix child before a needs: Package job starts.
          # Poll OneDrive instead so Finalize starts as soon as the winning Package
          # slot writes all three completion files.
          for attempt in {1..600}; do
            if source_complete; then
              echo "Full Chromium source is ready. Streaming it directly into the final gzip package..."
              break
            fi

            if (( attempt == 600 )); then
              echo "ERROR: timed out waiting 300 minutes for the completed Chromium source."
              echo "Expected: $source_archive, $source_ready, and $source_manifest"
              exit 1
            fi

            if (( attempt % 10 == 0 )); then
              echo "Source is not complete yet; still waiting on OneDrive (attempt $attempt/600)."
            fi
            sleep 30
          done

          archive_partial="$source_root/chromium-$REVISION.tar.gz.partial"
          checksum_partial="$source_root/chromium-$REVISION.sha256.partial"

          # The source archive is already a complete tar stream. Decompress zstd
          # and recompress that same tar stream as gzip without extracting Chromium
          # onto the runner. This keeps Finalize's local disk usage tiny.
          #
          # Show real progress for the long OneDrive -> zstd -> gzip -> OneDrive
          # pipeline. pv measures the known compressed source size, while rclone
          # reports the upload activity for the final gzip stream.
          source_bytes=$(rclone size "$source_archive" --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["bytes"])')
          source_gib=$(awk -v b="$source_bytes" 'BEGIN {printf "%.2f", b/1024/1024/1024}')
          echo "Source archive size: ${source_gib} GiB"
          echo "Packaging progress below is based on the compressed source bytes read."
          rclone deletefile "$archive_partial" >/dev/null 2>&1 || true
          rclone cat "$source_archive" |
            pv -p -t -e -r -b -s "$source_bytes" |
            zstd -d |
            gzip -1 |
            rclone rcat "$archive_partial" --progress --stats=10s --stats-one-line --onedrive-chunk-size 250M
          rclone moveto "$archive_partial" "$archive"

          echo "Calculating and verifying the final package checksum..."
          hash=$(rclone cat "$archive" | sha256sum | awk '{print $1}')
          printf '%s  chromium-%s.tar.gz\n' "$hash" "$REVISION" | rclone rcat "$checksum_partial"
          rclone moveto "$checksum_partial" "$checksum"

          echo "Verifying final package..."
          rclone lsf "$archive" >/dev/null
          rclone lsf "$checksum" >/dev/null

          expected_hash=$(rclone cat "$checksum" | awk '{print $1}')
          actual_hash=$(rclone cat "$archive" | sha256sum | awk '{print $1}')
          test -n "$expected_hash"
          test "$expected_hash" = "$actual_hash"

          rclone cat "$archive" | tar -tzf - >/dev/null
          echo "Final Chromium package is checksum-valid and structurally readable."

      - name: Commit Chromium revision
        if: steps.finalized.outputs.already != 'true'
        shell: bash
        env:
          REVISION: ${{ needs.ResolveRevision.outputs.revision }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' "$REVISION" > android/chromium_revision.txt
          printf '%s\n' "$REVISION" > windows/chromium_revision.txt
          git add android/chromium_revision.txt windows/chromium_revision.txt
          git diff --cached --quiet || git commit -m "Update Chromium revision"
          git push

      - name: Summary
        if: steps.finalized.outputs.already != 'true'
        env:
          REVISION: ${{ needs.ResolveRevision.outputs.revision }}
        run: |
          echo "Chromium $REVISION is fully packaged in OneDrive."
          echo "The source download used serial GitHub-hosted runners with OneDrive checkpoints."

      - name: Prepare platform build handoff
        if: steps.finalized.outputs.already != 'true'
        shell: bash
        env:
          REVISION: ${{ needs.ResolveRevision.outputs.revision }}
        run: |
          set -euo pipefail

          archive="onedrive:$WAVE_ONEDRIVE_PATH/chromium-$REVISION.tar.gz"
          checksum="onedrive:$WAVE_ONEDRIVE_PATH/chromium-$REVISION.sha256"

          rclone lsf "$archive" >/dev/null
          rclone lsf "$checksum" >/dev/null

          printf '{"revision":"%s","source_archive":"chromium-%s.tar.gz","checksum":"chromium-%s.sha256","ready_for_platform_builds":true}\n' \
            "$REVISION" "$REVISION" "$REVISION" |
            rclone rcat "onedrive:$WAVE_ONEDRIVE_PATH/chromium-$REVISION.ready.json"

          echo "Chromium $REVISION is ready for platform-specific compilation."
          echo "Android and Windows workflows will restore this verified source package and compile their own platform engine."

      - name: Clean temporary OneDrive source/checkpoint state
        if: steps.finalized.outputs.already != 'true'
        shell: bash
        env:
          REVISION: ${{ needs.ResolveRevision.outputs.revision }}
        run: |
          set -euo pipefail

          source_root="onedrive:$WAVE_ONEDRIVE_PATH/staging/$REVISION"
          active_marker="onedrive:$WAVE_ONEDRIVE_PATH/active_revision.json"

          old_revision=""
          if [ -f android/chromium_revision.txt ]; then
            old_revision=$(tr -d '\r\n ' < android/chromium_revision.txt)
          fi

          echo "Removing temporary source/checkpoint data after the final package and handoff are verified..."
          rclone deletefile "$source_root/chromium-$REVISION.source.tar.zst" >/dev/null 2>&1 || true
          rclone deletefile "$source_root/chromium-$REVISION.source.tar.zst.partial" >/dev/null 2>&1 || true
          rclone deletefile "$source_root/source.ready" >/dev/null 2>&1 || true
          rclone deletefile "$source_root/source.json" >/dev/null 2>&1 || true
          rclone deletefile "$source_root/checkpoint.tar.zst" >/dev/null 2>&1 || true
          rclone deletefile "$source_root/checkpoint.tar.zst.partial" >/dev/null 2>&1 || true
          rclone deletefile "$source_root/checkpoint.ready" >/dev/null 2>&1 || true
          rclone deletefile "$source_root/checkpoint.json" >/dev/null 2>&1 || true
          rclone deletefile "$source_root/chromium-$REVISION.tar.gz.partial" >/dev/null 2>&1 || true
          rclone deletefile "$source_root/chromium-$REVISION.sha256.partial" >/dev/null 2>&1 || true
          rclone deletefile "$active_marker" >/dev/null 2>&1 || true

          # Keep the previous packaged revision until the replacement revision
          # has been fully packaged, verified, and handed off.
          if [[ "$old_revision" =~ ^[0-9a-f]{40}$ ]] && [ "$old_revision" != "$REVISION" ]; then
            old_archive="onedrive:$WAVE_ONEDRIVE_PATH/chromium-$old_revision.tar.gz"
            old_checksum="onedrive:$WAVE_ONEDRIVE_PATH/chromium-$old_revision.sha256"
            old_ready="onedrive:$WAVE_ONEDRIVE_PATH/chromium-$old_revision.ready.json"
            echo "New Chromium $REVISION is fully ready. Removing old packaged revision $old_revision..."
            rclone deletefile "$old_archive" >/dev/null 2>&1 || true
            rclone deletefile "$old_checksum" >/dev/null 2>&1 || true
            rclone deletefile "$old_ready" >/dev/null 2>&1 || true
            echo "Old packaged revision $old_revision removed."
          else
            echo "No different previous packaged Chromium revision needs removal."
          fi

          echo "OneDrive temporary source/checkpoint cleanup complete."
