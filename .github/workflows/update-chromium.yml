name: Package Chromium for WaveBrowser

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-next-download-chunk]

concurrency:
  group: wave-browser-chromium-packaging
  queue: max
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  CHROMIUM_URL: https://chromium.googlesource.com/chromium/src
  WAVE_ONEDRIVE_PATH: WaveBrowser/Chromium
  DEPOT_TOOLS_UPDATE: "0"
  GSUTIL_ENABLE_LUCI_AUTH: "0"
  # One shared download serves both platform builds, so fetch the union of the
  # Android and Windows dependency sets. Chromium's DEPS selects platform-only
  # dependencies from target_os, so without it the checkout carries Linux deps
  # and the platform runhooks/gn steps fail on missing dependencies.
  CHROMIUM_TARGET_OS: '["android", "win"]'

jobs:
  DownloadChromium:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      WORK_ROOT: ${{ github.workspace }}/../wave-chromium-source
    steps:
      - name: Free Runner Disk Space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Install Chromium tools locally
        shell: bash
        run: |
          set -euo pipefail

          tools_root="$HOME/.cache/wave-browser/tools"
          bin_dir="$tools_root/bin"
          depot_tools_dir="$tools_root/depot_tools"

          # Keep depot_tools and its helper binaries visible to every child process.
          export PATH="$depot_tools_dir:$bin_dir:$PATH"

          mkdir -p "$bin_dir"

          if [ ! -x "$bin_dir/rclone" ]; then
            tmp_dir=$(mktemp -d)
            trap 'rm -rf "$tmp_dir"' EXIT

            archive_name="rclone-v1.75.1-linux-amd64.zip"
            archive_path="$tmp_dir/$archive_name"

            curl -fsSL "https://downloads.rclone.org/v1.75.1/$archive_name" \
              -o "$archive_path"
            curl -fsSL "https://downloads.rclone.org/v1.75.1/SHA256SUMS" \
              -o "$tmp_dir/SHA256SUMS"

            (
              cd "$tmp_dir"
              grep " $archive_name$" SHA256SUMS | sha256sum -c -
            )

            python3 -c '
          import sys
          import zipfile

          archive_path, output_dir = sys.argv[1:]

          with zipfile.ZipFile(archive_path) as z:
              binary = next(
                  name for name in z.namelist()
                  if name.endswith("/rclone")
              )
              z.extract(binary, output_dir)
          ' "$archive_path" "$tmp_dir"

            install -m 0755 \
              "$(find "$tmp_dir" -type f -name rclone -print -quit)" \
              "$bin_dir/rclone"
          fi

          if [ ! -x "$depot_tools_dir/gclient" ]; then
            rm -rf "$depot_tools_dir"
            git clone \
              --depth=1 \
              https://chromium.googlesource.com/chromium/tools/depot_tools.git \
              "$depot_tools_dir"
          fi

          if [ ! -f "$depot_tools_dir/python3_bin_reldir.txt" ]; then
            echo "Bootstrapping depot_tools Python runtime..."
            (
              cd "$depot_tools_dir"
              DEPOT_TOOLS_UPDATE=0 ./ensure_bootstrap
            )
          fi

          test -f "$depot_tools_dir/python3_bin_reldir.txt"
          test -x "$depot_tools_dir/luci-auth"
          command -v luci-auth

          echo "$bin_dir" >> "$GITHUB_PATH"
          echo "$depot_tools_dir" >> "$GITHUB_PATH"

          "$bin_dir/rclone" version
          PATH="$depot_tools_dir:$bin_dir:$PATH" \
            DEPOT_TOOLS_UPDATE=0 \
            gclient --version

      - name: Configure OneDrive
        shell: bash
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.WAVE_CHROMIUM_BACKUP_ONEDRIVE }}
        run: |
          set -euo pipefail

          test -n "$RCLONE_CONFIG_CONTENT" || {
            echo "Missing WAVE_CHROMIUM_BACKUP_ONEDRIVE repository secret."
            exit 1
          }

          mkdir -p "$HOME/.config/rclone"
          printf '%s\n' "$RCLONE_CONFIG_CONTENT" \
            > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"

      - name: Resolve Chromium revision
        id: revision
        shell: bash
        run: |
          set -euo pipefail

          lock_path="onedrive:$WAVE_ONEDRIVE_PATH/current_revision.json"

          if rclone cat "$lock_path" \
            > "$RUNNER_TEMP/current_revision.json" 2>/dev/null; then
            latest=$(python3 - "$RUNNER_TEMP/current_revision.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)

          print(data["revision"])
          PY
            )
          else
            latest=$(
              timeout 90s \
                git ls-remote "$CHROMIUM_URL" refs/heads/main |
                awk '{print $1}'
            )

            [[ "$latest" =~ ^[0-9a-f]{40}$ ]] || {
              echo "Could not determine a valid Chromium revision."
              exit 1
            }

            printf \
              '{"revision":"%s","created_at":"%s"}\n' \
              "$latest" \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" |
              rclone rcat "$lock_path"

            echo "Locked Chromium revision to $latest for this packaging job."
          fi

          [[ "$latest" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Persistent Chromium revision lock is invalid."
            exit 1
          }

          revision_root="onedrive:$WAVE_ONEDRIVE_PATH/$latest"
          ready="$revision_root/package.ready.json"

          if rclone cat "$ready" \
            > "$RUNNER_TEMP/package.ready.json" 2>/dev/null; then
            if python3 \
              - "$RUNNER_TEMP/package.ready.json" "$latest" <<'PY'
          import json
          import sys

          path, expected_revision = sys.argv[1:]

          try:
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(f"Invalid package.ready.json: {exc}")

          expected_package = f"package/chromium-{expected_revision}.tar.gz"
          expected_checksum = f"package/chromium-{expected_revision}.sha256"

          if (
              data.get("revision") != expected_revision
              or data.get("ready_for_platform_builds") is not True
              or data.get("package_path") != expected_package
              or data.get("checksum_path") != expected_checksum
          ):
              raise SystemExit(
                  "package.ready.json does not confirm the expected "
                  "Chromium artifacts are finalized."
              )
          PY
            then
              package_path=$(python3 \
                - "$RUNNER_TEMP/package.ready.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              print(json.load(f)["package_path"])
          PY
              )

              checksum_path=$(python3 \
                - "$RUNNER_TEMP/package.ready.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              print(json.load(f)["checksum_path"])
          PY
              )

              if \
                rclone lsf \
                  "onedrive:$WAVE_ONEDRIVE_PATH/$latest/$package_path" \
                  >/dev/null 2>&1 &&
                rclone lsf \
                  "onedrive:$WAVE_ONEDRIVE_PATH/$latest/$checksum_path" \
                  >/dev/null 2>&1
              then
                echo \
                  "Chromium $latest is already finalized and its package/checksum are present."

                rclone deletefile "$lock_path" \
                  >/dev/null 2>&1 || true
                echo "Cleared completed Chromium revision lock."

                echo "skip=true" >> "$GITHUB_OUTPUT"
                echo "revision=$latest" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              echo \
                "package.ready.json exists, but its package or checksum is missing; resuming repair."
            fi
          fi

          rclone mkdir "$revision_root/source"
          rclone mkdir "$revision_root/package"

          printf \
            '{"revision":"%s","status":"downloading","updated_at":"%s"}\n' \
            "$latest" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" |
            rclone rcat "$revision_root/download.json"

          echo "revision=$latest" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Chromium revision: $latest"

      - name: Lock depot_tools revision
        if: steps.revision.outputs.skip != 'true'
        env:
          REVISION: ${{ steps.revision.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail

          tools_dir="$HOME/.cache/wave-browser/tools/depot_tools"
          test -d "$tools_dir/.git"

          lock_path="onedrive:$WAVE_ONEDRIVE_PATH/$REVISION/depot_tools_revision.json"

          if rclone cat "$lock_path" \
            > "$RUNNER_TEMP/depot_tools_revision.json" 2>/dev/null; then
            locked=$(python3 \
              - "$RUNNER_TEMP/depot_tools_revision.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)

          print(data["revision"])
          PY
            )

            [[ "$locked" =~ ^[0-9a-f]{40}$ ]] || {
              echo "Invalid persisted depot_tools revision."
              exit 1
            }

            git -C "$tools_dir" fetch --depth=1 origin "$locked"
            git -C "$tools_dir" checkout --detach "$locked"
            echo "Using persisted depot_tools revision $locked."
          else
            locked=$(git -C "$tools_dir" rev-parse HEAD)

            [[ "$locked" =~ ^[0-9a-f]{40}$ ]] || {
              echo "Could not determine depot_tools revision."
              exit 1
            }

            printf \
              '{"revision":"%s","created_at":"%s"}\n' \
              "$locked" \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" |
              rclone rcat "$lock_path"

            echo "Locked depot_tools to $locked for Chromium $REVISION."
          fi

          if [ ! -f "$tools_dir/python3_bin_reldir.txt" ]; then
            echo "Bootstrapping the locked depot_tools revision..."
            (
              cd "$tools_dir"
              DEPOT_TOOLS_UPDATE=0 ./ensure_bootstrap
            )
          fi

          test -f "$tools_dir/python3_bin_reldir.txt"

          echo \
            "depot_tools revision: $(git -C "$tools_dir" rev-parse HEAD)"
          command -v gclient
          DEPOT_TOOLS_UPDATE=0 gclient --version

      - name: Mount the Chromium source directory on OneDrive
        if: steps.revision.outputs.skip != 'true'
        env:
          REVISION: ${{ steps.revision.outputs.revision }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$WORK_ROOT"

          # PATCH: --log-level/--log-file make OneDrive throttling (429/503
          # pacer back-off) visible; --rc lets the watchdog query the mount;
          # --dir-cache-time raised from 1m to 10m to cut directory re-lists.
          rclone mount \
            "onedrive:$WAVE_ONEDRIVE_PATH/$REVISION/source" \
            "$WORK_ROOT" \
            --vfs-cache-mode full \
            --cache-dir "$RUNNER_TEMP/rclone-vfs-cache" \
            --vfs-cache-max-size 25G \
            --vfs-cache-max-age 10m \
            --vfs-write-back 2s \
            --dir-cache-time 10m \
            --poll-interval 30s \
            --timeout 1m \
            --contimeout 15s \
            --retries 5 \
            --low-level-retries 20 \
            --retries-sleep 10s \
            --buffer-size 16M \
            --transfers 4 \
            --checkers 8 \
            --log-level INFO \
            --log-file "$RUNNER_TEMP/rclone-mount.log" \
            --rc \
            --rc-addr 127.0.0.1:5572 \
            --rc-no-auth &

          echo $! > "$RUNNER_TEMP/rclone-mount.pid"

          for _ in $(seq 1 60); do
            if mountpoint -q "$WORK_ROOT"; then
              echo "OneDrive Chromium source mount is ready."
              exit 0
            fi
            sleep 2
          done

          echo "OneDrive mount did not become ready."
          exit 1

      - name: Download Chromium and dependencies directly into OneDrive
        id: download
        if: steps.revision.outputs.skip != 'true'
        env:
          REVISION: ${{ steps.revision.outputs.revision }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/chromium-download.sh" <<'DOWNLOAD_SCRIPT'
          set -euo pipefail

          cd "$WORK_ROOT"

          # PATCH: only remove stale git locks. The old
          # `find "$WORK_ROOT" -name "*.lock" -delete` walked the whole mount
          # and deleted tracked files such as Cargo.lock / yarn.lock.
          find "$WORK_ROOT/src/.git" -maxdepth 2 -name "*.lock" -delete 2>/dev/null || true

          # PATCH: do not let gclient build a git cache / mirror of src inside
          # the OneDrive mount. That contradicts the shallow fetch below and
          # is a prime suspect for the silent "Still working on: src" stall.
          unset GCLIENT_CACHE_DIR

          # PATCH: record every git command (including gclient's children) so
          # a stall shows exactly which command is stuck.
          export GIT_TRACE="$RUNNER_TEMP/git-trace.log"

          # PATCH: avoid hours-long silent git housekeeping / stat scans on FUSE.
          git config --global gc.auto 0
          git config --global maintenance.auto false
          git config --global core.checkStat minimal
          git config --global core.trustctime false
          git config --global core.preloadindex true

          update_status() {
            local status="$1"
            local extra="${2:-}"

            if ! printf \
              '{"revision":"%s","status":"%s","updated_at":"%s"%s}\n' \
              "$REVISION" \
              "$status" \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              "$extra" |
              rclone rcat \
                "onedrive:$WAVE_ONEDRIVE_PATH/$REVISION/download.json"
            then
              echo \
                "Warning: could not update download.json; continuing Chromium sync."
            fi
          }

          previous_progress=0
          previous_files=0
          previous_total=508491

          if rclone cat \
            "onedrive:$WAVE_ONEDRIVE_PATH/$REVISION/progress.json" \
            > "$RUNNER_TEMP/progress.json" 2>/dev/null
          then
            read -r previous_progress previous_files previous_total < <(
              python3 - "$RUNNER_TEMP/progress.json" <<'PY'
          import json
          import sys

          try:
              with open(sys.argv[1], encoding="utf-8") as f:
                  data = json.load(f)
              print(
                  int(data.get("percent", 0)),
                  int(data.get("files", 0)),
                  int(data.get("total", 508491)),
              )
          except (OSError, ValueError, TypeError, json.JSONDecodeError):
              print("0 0 508491")
          PY
            )
          fi

          if [ "$previous_files" -gt 0 ]; then
            echo \
              "Resuming Chromium from previous persisted progress: ${previous_progress}% (${previous_files}/${previous_total} files)."
          else
            echo \
              "No previous Chromium progress checkpoint found; starting from 0% (0/508491 files)."
          fi

          update_status "running"

          rclone deletefile \
            "onedrive:$WAVE_ONEDRIVE_PATH/$REVISION/source.ready.json" \
            >/dev/null 2>&1 || true

          if [ ! -f .gclient ] || [ ! -e "$WORK_ROOT/src/.git" ]; then
            echo \
              "No complete Chromium checkout found; creating the locked checkout directly."

            if [ ! -f .gclient ]; then
              gclient config --name src "$CHROMIUM_URL"
            fi

            # gclient config does not emit target_os, and gclient sync ignores
            # target_os on the command line. Inject it into .gclient so
            # Chromium's DEPS pulls the Android and Windows dependencies this
            # shared package must carry for the platform builds.
            python3 - "$CHROMIUM_TARGET_OS" <<'PY'
          import json
          import re
          import sys

          target_os = json.loads(sys.argv[1])

          with open(".gclient", encoding="utf-8") as f:
              config = f.read()

          os_entry = "target_os = %s" % json.dumps(target_os)

          if "target_os" in config:
              config = re.sub(r"(?m)^target_os\s*=.*$", os_entry, config)
          else:
              if not config.endswith("\n"):
                  config += "\n"
              config += os_entry + "\n"

          with open(".gclient", "w", encoding="utf-8") as f:
              f.write(config)
          PY

          echo ".gclient target_os:"
          grep -n "target_os" .gclient || true

            if [ ! -e "$WORK_ROOT/src/.git" ]; then
              rm -rf "$WORK_ROOT/src"
              mkdir -p "$WORK_ROOT/src"
              git -C "$WORK_ROOT/src" init
              git -C "$WORK_ROOT/src" remote add origin "$CHROMIUM_URL"
            fi
          else
            echo \
              "Existing persistent Chromium checkout found; reusing it."
          fi

          GIT_WORK_TREE="$WORK_ROOT/src"
          test -e "$GIT_WORK_TREE/.git"

          git \
            --git-dir="$GIT_WORK_TREE/.git" \
            --work-tree="$GIT_WORK_TREE" \
            config http.version HTTP/1.1

          # Chromium's source pack is extremely large. When Git is writing the
          # pack into the OneDrive-backed filesystem, transfer throughput can
          # temporarily fall below 1 KB/s even though the fetch is still alive.
          # Do not abort a healthy fetch after only 30 seconds of low throughput.
          git \
            --git-dir="$GIT_WORK_TREE/.git" \
            --work-tree="$GIT_WORK_TREE" \
            config http.lowSpeedLimit 1

          git \
            --git-dir="$GIT_WORK_TREE/.git" \
            --work-tree="$GIT_WORK_TREE" \
            config http.lowSpeedTime 600

          for attempt in 1 2 3 4 5; do
            # A failed shallow fetch can leave this lock behind after Git has
            # already exited. Remove Git's stale lock files before the next
            # attempt so a retry is actually able to start.
            find "$GIT_WORK_TREE/.git" \
              -maxdepth 1 \
              -type f \
              -name "*.lock" \
              -delete 2>/dev/null || true

            if git \
              --git-dir="$GIT_WORK_TREE/.git" \
              --work-tree="$GIT_WORK_TREE" \
              fetch \
              --no-tags \
              --depth=1 \
              --progress \
              origin "$REVISION"
            then
              break
            fi

            echo \
              "Chromium source fetch attempt $attempt failed; cleaning stale Git locks before retrying..."

            find "$GIT_WORK_TREE/.git" \
              -maxdepth 1 \
              -type f \
              -name "*.lock" \
              -delete 2>/dev/null || true

            sleep $((attempt * 15))

            if [ "$attempt" -eq 5 ]; then
              update_status \
                "failed" \
                ",\"reason\":\"chromium_git_fetch_failed\""
              exit 1
            fi
          done

          current_head=""
          if current_head=$(
            git \
              --git-dir="$GIT_WORK_TREE/.git" \
              rev-parse HEAD 2>/dev/null
          ); then
            :
          fi

          if [ "$current_head" != "$REVISION" ]; then
            echo \
              "Persistent checkout is at $current_head; moving src to the locked revision before gclient sync."

            # Move the main Chromium src revision with Git itself rather than
            # making gclient perform the revision transition on the OneDrive
            # rclone mount. This avoids the silent, filesystem-heavy
            # "Still working on: src" state seen during gclient sync.
            GIT_TERMINAL_PROMPT=0 \
              git \
                --git-dir="$GIT_WORK_TREE/.git" \
                --work-tree="$GIT_WORK_TREE" \
                checkout --force --detach "$REVISION"

            current_head=$(git --git-dir="$GIT_WORK_TREE/.git" rev-parse HEAD)
            test "$current_head" = "$REVISION"

            echo \
              "Chromium src is now explicitly checked out at $REVISION before gclient sync."
          else
            echo \
              "Persistent checkout is already at $REVISION; preserving its current working-tree state."
          fi

          if [ "$current_head" = "$REVISION" ]; then
            printf \
              '{"revision":"%s","status":"checkout-ready","updated_at":"%s"}\n' \
              "$REVISION" \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" |
              rclone rcat \
                "onedrive:$WAVE_ONEDRIVE_PATH/$REVISION/checkout.ready.json"
          else
            printf \
              '{"revision":"%s","status":"revision-pending","current_head":"%s","updated_at":"%s"}\n' \
              "$REVISION" \
              "$current_head" \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" |
              rclone rcat \
                "onedrive:$WAVE_ONEDRIVE_PATH/$REVISION/checkout.ready.json"
          fi

          update_status "syncing-dependencies"

          set +e
          script -q -e -c '
            for attempt in 1 2 3; do
              echo "gclient sync attempt $attempt/3"

              if gclient sync -v -v \
                --nohooks \
                --no-history \
                -j 2 \
                --revision "src@$REVISION"
              then
                exit 0
              else
                status=$?
              fi

              if [ "$attempt" -lt 3 ]; then
                echo \
                  "gclient sync attempt $attempt failed (exit $status); retrying after 30s..."
                sleep 30
              fi
            done

            exit 1
          ' /dev/null 2>&1 |
            stdbuf -o0 tr '\r' '\n' |
            while IFS= read -r line; do
              if [[ "$line" =~ Updating[[:space:]]files:[[:space:]]+([0-9]+)%[[:space:]]+\(([0-9]+)/([0-9]+)\) ]]; then
                percent="${BASH_REMATCH[1]}"
                files="${BASH_REMATCH[2]}"
                total="${BASH_REMATCH[3]}"

                display_files="$files"
                if [ "$display_files" -lt "$previous_files" ]; then
                  display_files="$previous_files"
                fi

                printf \
                  'Updating files: %s%% (%s/%s)\n' \
                  "$percent" \
                  "$display_files" \
                  "$total"

                if [ "$files" -gt "$previous_files" ]; then
                  previous_progress="$percent"
                  previous_files="$files"
                  previous_total="$total"

                  printf \
                    '{"revision":"%s","status":"progress","percent":%s,"files":%s,"total":%s,"updated_at":"%s"}\n' \
                    "$REVISION" \
                    "$percent" \
                    "$files" \
                    "$total" \
                    "$(date -u +%Y-%m-%dT%H:%M:%SZ)" |
                    rclone rcat \
                      "onedrive:$WAVE_ONEDRIVE_PATH/$REVISION/progress.json" ||
                    true
                fi
              else
                echo "$line"
              fi
            done
          sync_status=${PIPESTATUS[0]}
          set -e

          if [ "$sync_status" -ne 0 ]; then
            update_status \
              "failed" \
              ",\"reason\":\"gclient_sync_failed\",\"exit_code\":$sync_status"

            printf \
              '{"revision":"%s","status":"failed","reason":"gclient_sync_failed","exit_code":%s,"updated_at":"%s"}\n' \
              "$REVISION" \
              "$sync_status" \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" |
              rclone rcat \
                "onedrive:$WAVE_ONEDRIVE_PATH/$REVISION/download.json" ||
              true

            exit "$sync_status"
          fi

          test -d "$WORK_ROOT/src"
          test -f "$WORK_ROOT/.gclient"
          test -f "$WORK_ROOT/.gclient_entries"

          printf \
            '{"revision":"%s","status":"source-ready","source_path":"source"}\n' \
            "$REVISION" |
            rclone rcat \
              "onedrive:$WAVE_ONEDRIVE_PATH/$REVISION/source.ready.json"

          echo \
            "The complete Chromium checkout and dependencies are now stored in OneDrive."
          DOWNLOAD_SCRIPT

          set +e

          DISK_ALLOWED_BYTES=13950000000
          DISK_SAFETY_BYTES=2147483648
          DISK_MONITOR_INTERVAL=1

          DISK_BASELINE_BYTES=$(
            df -B1 --output=used "$HOME" 2>/dev/null |
              tail -n 1 |
              tr -d " "
          )

          DISK_FREE_BYTES=$(
            df -B1 --output=avail "$HOME" 2>/dev/null |
              tail -n 1 |
              tr -d " "
          )

          [[ "$DISK_BASELINE_BYTES" =~ ^[0-9]+$ ]] || {
            echo "Could not determine initial runner disk usage."
            exit 1
          }

          [[ "$DISK_FREE_BYTES" =~ ^[0-9]+$ ]] || {
            echo "Could not determine free runner disk space."
            exit 1
          }

          # The fixed 13.95 GB allowance assumes a large runner. On a small one
          # it can exceed the whole disk, so cap it to the free space minus a
          # safety margin. The VFS cache is released on unmount, so each run
          # hands off at this limit and the next run resumes from OneDrive.
          if [ "$((DISK_FREE_BYTES - DISK_SAFETY_BYTES))" -lt "$DISK_ALLOWED_BYTES" ]; then
            DISK_ALLOWED_BYTES=$((DISK_FREE_BYTES - DISK_SAFETY_BYTES))
          fi

          if [ "$DISK_ALLOWED_BYTES" -lt 1000000000 ]; then
            echo \
              "::error::Only $((DISK_FREE_BYTES / 1000000000)) GB free on the runner; the Chromium download needs at least ~1 GB of local scratch per run. Use a runner with more disk."
            exit 1
          fi

          DISK_LIMIT_BYTES=$((DISK_BASELINE_BYTES + DISK_ALLOWED_BYTES))

          export DISK_BASELINE_BYTES
          export DISK_LIMIT_BYTES
          export DISK_ALLOWED_BYTES

          echo "Runner initial disk usage: $(python3 -c '
          import os

          value = int(os.environ["DISK_BASELINE_BYTES"])
          print(f"{value/(1000**3):.2f}")
          ') GB"

          echo "Local disk allowed for Chromium this run: $(python3 -c '
          import os

          value = int(os.environ["DISK_ALLOWED_BYTES"])
          print(f"{value/(1000**3):.2f}")
          ') GB"

          echo "Chromium download will stop at: $(python3 -c '
          import os

          value = int(os.environ["DISK_LIMIT_BYTES"])
          print(f"{value/(1000**3):.2f}")
          ') GB total usage."

          monitor_disk() {
            while kill -0 "$DOWNLOAD_PID" 2>/dev/null; do
              if ! mountpoint -q "$WORK_ROOT"; then
                echo \
                  "Chromium OneDrive mount disappeared. Stopping the download to prevent local-disk writes."
                echo "mount_failure=true" \
                  > "$RUNNER_TEMP/mount-failure"
                kill -TERM -- "-$DOWNLOAD_PID" 2>/dev/null ||
                  kill -TERM "$DOWNLOAD_PID" 2>/dev/null ||
                  true
                return
              fi

              used_bytes=$(
                df -B1 --output=used "$HOME" 2>/dev/null |
                  tail -n 1 |
                  tr -d " "
              )

              if [[ "$used_bytes" =~ ^[0-9]+$ ]] &&
                [ "$used_bytes" -ge "$DISK_LIMIT_BYTES" ]; then
                echo \
                  "Chromium job consumed its 13.95 GB local-disk allowance. Stopping Chromium download to protect the runner."
                echo "disk_handoff=true" \
                  > "$RUNNER_TEMP/disk-handoff"
                kill -TERM -- "-$DOWNLOAD_PID" 2>/dev/null ||
                  kill -TERM "$DOWNLOAD_PID" 2>/dev/null ||
                  true
                return
              fi

              sleep "$DISK_MONITOR_INTERVAL"
            done
          }

          # PATCH: stall watchdog. Every 2 minutes it prints which git /
          # gclient / rclone processes are alive, the latest git command, and
          # any rclone errors or throttling. If neither the VFS cache size nor
          # the git trace changes for ~30 minutes, it stops the download so the
          # job fails fast (with diagnostics) instead of idling for 5.5 hours.
          watchdog() {
            local prev="" idle=0 cur
            while kill -0 "$DOWNLOAD_PID" 2>/dev/null; do
              sleep 120

              echo "::group::watchdog $(date -u +%T)"
              ps -eo pid,etimes,stat,pcpu,args --sort=-etimes |
                grep -E 'git|gclient|rclone|gsutil' |
                grep -v grep |
                cut -c1-220 |
                head -n 20 || true
              echo "--- last git commands ---"
              tail -n 5 "$RUNNER_TEMP/git-trace.log" 2>/dev/null |
                cut -c1-300 || true
              echo "--- rclone errors / throttling ---"
              grep -iE 'error|429|throttl|pacer|retry' \
                "$RUNNER_TEMP/rclone-mount.log" 2>/dev/null |
                tail -n 5 || true
              echo "::endgroup::"

              cur="$(du -sb "$RUNNER_TEMP/rclone-vfs-cache" 2>/dev/null | cut -f1):$(stat -c %s "$RUNNER_TEMP/git-trace.log" 2>/dev/null)"

              if [ "$cur" = "$prev" ]; then
                idle=$((idle + 1))
              else
                idle=0
              fi
              prev="$cur"

              if [ "$idle" -ge 15 ]; then
                echo \
                  "Watchdog: no cache change and no new git command for ~30 minutes. Stopping download."
                echo "stalled=true" > "$RUNNER_TEMP/stalled"
                kill -TERM -- "-$DOWNLOAD_PID" 2>/dev/null ||
                  kill -TERM "$DOWNLOAD_PID" 2>/dev/null ||
                  true
                return
              fi
            done
          }

          setsid \
            timeout \
              --foreground \
              --signal=TERM \
              --kill-after=60s \
              330m \
              bash "$RUNNER_TEMP/chromium-download.sh" &
          DOWNLOAD_PID=$!

          monitor_disk &
          MONITOR_PID=$!

          watchdog &
          WATCHDOG_PID=$!

          wait "$DOWNLOAD_PID"
          status=$?

          kill "$MONITOR_PID" 2>/dev/null || true
          wait "$MONITOR_PID" 2>/dev/null || true
          kill "$WATCHDOG_PID" 2>/dev/null || true
          wait "$WATCHDOG_PID" 2>/dev/null || true

          set -e

          if [ -f "$RUNNER_TEMP/mount-failure" ]; then
            printf \
              '{"revision":"%s","status":"failed","updated_at":"%s","reason":"onedrive_mount_lost"}\n' \
              "$REVISION" \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" |
              rclone rcat \
                "onedrive:$WAVE_ONEDRIVE_PATH/$REVISION/download.json" ||
              true

            echo \
              "The OneDrive mount was lost; refusing to continue or automatically chain another run."
            exit 1
          fi

          # PATCH: a watchdog stop is a failure, not a handoff. Without this the
          # kill (exit 143) would fall into the handoff branch below and
          # re-dispatch the same stall forever. Must stay above the handoff block.
          if [ -f "$RUNNER_TEMP/stalled" ]; then
            printf \
              '{"revision":"%s","status":"failed","updated_at":"%s","reason":"download_stalled"}\n' \
              "$REVISION" \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" |
              rclone rcat \
                "onedrive:$WAVE_ONEDRIVE_PATH/$REVISION/download.json" ||
              true

            echo "Download stalled; failing instead of handing off. Last log lines:"
            echo "--- git-trace.log ---"
            tail -n 50 "$RUNNER_TEMP/git-trace.log" 2>/dev/null || true
            echo "--- rclone-mount.log ---"
            tail -n 50 "$RUNNER_TEMP/rclone-mount.log" 2>/dev/null || true
            exit 1
          fi

          if [ "$status" -eq 124 ] ||
            [ "$status" -eq 143 ] ||
            [ "$status" -eq 137 ] ||
            [ -f "$RUNNER_TEMP/disk-handoff" ]; then
            printf \
              '{"revision":"%s","status":"handoff","updated_at":"%s","next_run":true}\n' \
              "$REVISION" \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" |
              rclone rcat \
                "onedrive:$WAVE_ONEDRIVE_PATH/$REVISION/download.json" ||
              true

            if [ -f "$RUNNER_TEMP/disk-handoff" ]; then
              echo \
                "Local disk reached the safe limit; readiness step will verify after cleanup."
            else
              echo \
                "5h30m download deadline reached; readiness step will verify after cleanup."
            fi

            echo "handoff=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$status" -ne 0 ]; then
            printf \
              '{"revision":"%s","status":"failed","updated_at":"%s","exit_code":%s}\n' \
              "$REVISION" \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              "$status" |
              rclone rcat \
                "onedrive:$WAVE_ONEDRIVE_PATH/$REVISION/download.json" ||
              true
          fi

          exit "$status"

      - name: Unmount OneDrive source
        if: always() && steps.revision.outputs.skip != 'true'
        shell: bash
        run: |
          set +e

          fusermount3 -u "$WORK_ROOT" 2>/dev/null ||
            fusermount -u "$WORK_ROOT" 2>/dev/null ||
            true

          if [ -f "$RUNNER_TEMP/rclone-mount.pid" ]; then
            mount_pid="$(cat "$RUNNER_TEMP/rclone-mount.pid")"

            for _ in $(seq 1 30); do
              kill -0 "$mount_pid" 2>/dev/null || break
              sleep 1
            done

            kill "$mount_pid" 2>/dev/null || true
          fi

      # PATCH: keep the diagnostics from every run, including failed ones.
      - name: Upload diagnostics
        if: always() && steps.revision.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chromium-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/rclone-mount.log
            ${{ runner.temp }}/git-trace.log
          if-no-files-found: ignore

      - name: Verify Chromium readiness and continue
        if: steps.download.outcome == 'success' && !cancelled() && steps.revision.outputs.skip != 'true'
        env:
          REVISION: ${{ steps.revision.outputs.revision }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          ready_path="onedrive:$WAVE_ONEDRIVE_PATH/$REVISION/source.ready.json"
          ready=false

          if rclone cat "$ready_path" \
            > "$RUNNER_TEMP/source.ready.json" 2>/dev/null; then
            if python3 \
              - "$RUNNER_TEMP/source.ready.json" "$REVISION" <<'PY'
          import json
          import sys

          path, expected_revision = sys.argv[1:]

          try:
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(f"Invalid source.ready.json: {exc}")

          if (
              data.get("revision") != expected_revision
              or data.get("status") != "source-ready"
          ):
              raise SystemExit(
                  "source.ready.json does not confirm the expected "
                  "Chromium revision is ready."
              )
          PY
            then
              ready=true
            fi
          fi

          if [ "$ready" = "true" ]; then
            echo \
              "Chromium $REVISION is fully ready. Triggering Finalize."

            # PATCH: the original python snippet was missing a closing paren
            # on print(...), so payload creation failed with a SyntaxError.
            payload=$(
              python3 -c '
          import json
          import os

          print(
              json.dumps(
                  {
                      "event_type": "chromium-source-ready",
                      "client_payload": {
                          "revision": os.environ["REVISION"]
                      },
                  }
              )
          )
          '
            )

            curl -fsSL \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/dispatches" \
              -d "$payload"

            echo "Triggered Finalize for Chromium $REVISION."
          else
            echo \
              "Chromium $REVISION is not fully ready yet. Triggering update-chromium.yml again..."

            curl -fsSL \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/update-chromium.yml/dispatches" \
              -d '{"ref":"main"}'

            echo "Queued another update-chromium.yml run."
          fi
